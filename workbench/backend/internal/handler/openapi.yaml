    get:
      tags: [projects]
      summary: 按原来源摘要核对已整理工程包
      description: 只读返回原生资源编号、文件名、实际SHA256和字节数；不改变项目，不重新打包。
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: sourceSha256, in: query, required: true, schema: {type: string, pattern: '^[a-f0-9]{64}$'}}
      responses:
        "200": {$ref: "#/components/responses/Envelope"}
        "404": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /projects/{id}/delivery-packages:
    post:
      tags: [projects]
      summary: 整理固定来源的原生文档、原片及OTIO/SRT工程包
      description: 使用原生资源存储与配额，不运行模型。响应未知按原摘要核对或重试；同来源复用原资源，之后的编辑保留。整理前后来源变化、媒体缺失或取消不会交付残缺ZIP。
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceSha256]
              properties:
                sourceSha256: {type: string, pattern: '^[a-f0-9]{64}$'}
      responses:
        "200": {$ref: "#/components/responses/Envelope"}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /projects/{id}/delivery-package:
    get:
      tags: [projects]
      summary: 直接下载拥有项目的完整素材工程包
      description: 校验完成后返回ZIP，清理临时文件；不保存项目，不运行模型。固定来源回执及重试请使用delivery-packages。
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: 完整素材工程ZIP
          content:
            application/zip:
              schema: {type: string, format: binary}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /project-creations:
    post:
      tags: [projects]
      summary: 以稳定请求编号创建原生项目及初始工作流
      description: 项目、工作流和回执原子提交。相同账号及编号重试返回原项目；不同内容报409，原项目已删除报410，不重新创建。不运行模型。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, idempotencyKey]
              properties:
                name: {type: string}
                description: {type: string}
                type: {type: string, default: short-drama}
                aspectRatio: {type: string, default: '9:16'}
                sourceType: {type: string, default: blank}
                idempotencyKey: {type: string, minLength: 16, maxLength: 128}
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
  /resources:
    get:
      tags: [resources]
      summary: 当前用户资源列表
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
    post:
      tags: [resources]
      summary: 上传资源文件
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "403":
          description: 配额用尽（code=40301, reason=quota_exceeded 或 storage_capacity_exceeded）；账号只读（code=40302, reason=storage_read_only）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /resources/uploads:
    post:
      tags: [resources]
      summary: 创建当前用户的分片上传会话并预留配额
      description: 每片最多8MB；会话需要粘性路由，过期或进程重启后可按原幂等编号重新上传。请求头与正文同时提供编号时必须一致。
      parameters:
        - in: header
          name: X-Idempotency-Key
          schema: { type: string }
          description: 原文件上传的稳定编号，网页与MCP沿用同一约定
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, size]
              properties:
                fileName: { type: string, description: 文件名，UTF-8最多255字节 }
                size: { type: integer, minimum: 1 }
                kind: { type: string, description: 完成时仍由服务端根据真实内容判断类型 }
                width: { type: integer }
                height: { type: integer }
                durationMs: { type: integer }
                idempotencyKey: { type: string, description: 非请求头调用方可在正文提供 }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
  /resources/uploads/{id}/chunks/{index}:
    put:
      tags: [resources]
      summary: 向当前用户会话写入一片原始二进制
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: index
          required: true
          schema: { type: integer, minimum: 0 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "404":
          $ref: "#/components/responses/Error"
  /resources/uploads/{id}/complete:
    post:
      tags: [resources]
      summary: 合并完整分片并保存为原生资源
      description: 沿用初始化时的幂等编号、媒体检测和配额规则；成功或失败均清理本会话临时文件。响应不确定时按原编号重新上传核对，不改用新编号。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /resources/uploads/{id}:
    delete:
      tags: [resources]
      summary: 结束当前用户的临时上传并释放预留配额
      description: 只删除该会话的临时分片，不删除已经保存的资源。其他账号、已结束或未知会话返回404。清理失败保留会话供重试。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "404":
          $ref: "#/components/responses/Error"
  /resources/access:
    post:
      tags: [resources]
      summary: 批量签发当前用户资源访问描述
      description: 统一处理展示、下载、复制、浏览器字节处理和模型输入；客户端不能通过查询参数选择 direct/proxy。每项独立成功或失败。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 100
              items:
                type: object
                required: [resourceId]
                properties:
                  resourceId: {type: string}
                  purpose: {type: string, enum: [display, copy, download, browser-process, provider-input], default: display}
                  variant: {type: string, enum: [original, playback], default: original}
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /resources/{id}/file:
    get:
      tags: [resources]
      summary: 读取资源二进制（非 JSON 信封）
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: access
          schema: { type: string, enum: ["1"] }
          description: 仅返回统一访问描述，不返回文件正文。
        - in: query
          name: variant
          schema: { type: string, enum: [original, playback], default: original }
        - in: query
          name: purpose
          schema: { type: string, enum: [display, download, browser-process], default: display }
      responses:
        "200":
          description: 文件流
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /workbench/tools:
    get:
      tags: [workbench]
      summary: 获取当前用户可用的工作台工具
      parameters:
        - in: query
          name: kind
          required: true
          schema: { type: string, enum: [image, video] }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /workbench/tasks:
    get:
      tags: [workbench]
      summary: 查询当前用户的工作台任务
      parameters:
        - in: query
          name: kind
          required: true
          schema: { type: string, enum: [image, video] }
        - in: query
          name: activeOnly
          schema: { type: boolean, default: false }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [workbench]
      summary: 创建工作台生成任务
      description: 仅接受模型选择意图、资源 ID、提示词和允许的生成参数；toolId 可选，服务端校验开关、所选工具、资源、模型能力和账单，不接受客户端 providerConfig、密钥或上游 URL。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, prompt, model]
              properties:
                kind: { type: string, enum: [image, video] }
                toolId: { type: string }
                presetId: { type: string }
                prompt: { type: string, minLength: 1, maxLength: 32000 }
                model: { type: string }
                logicalModelId: { type: string }
                channelId: { type: string, description: 系统渠道模型没有 logicalModelId 时提交渠道 ID，二者至少一个 }
                batch:
                  type: object
                  additionalProperties: false
                  description: 同一次提交拆出的多个任务共用一个批次 ID，只用于列表分组展示；每个任务仍各自准入和计费。列表项通过 clientContext.batchId/batchIndex/batchCount 返回。
                  required: [id, index, count]
                  properties:
                    id: { type: string, pattern: "^[A-Za-z0-9_-]{8,64}$" }
                    index: { type: integer, minimum: 0 }
                    count: { type: integer, minimum: 1, maximum: 20 }
                modelChoice:
                  type: object
                  additionalProperties: false
                  properties:
                    logicalModelId: { type: string }
                    modelName: { type: string }
                workbench:
                  type: object
                  additionalProperties: false
                  properties:
                    kind: { type: string, enum: [image, video] }
                    toolId: { type: string }
                    presetId: { type: string }
                parameters:
                  type: object
                  additionalProperties: false
                  properties:
                    size: { type: string }
                    quality: { type: string }
                    imageResolution: { type: string }
                    count: { type: integer, minimum: 1, maximum: 20 }
                    seconds: { type: integer, minimum: 1 }
                    ratio: { type: string }
                    resolution: { type: string }
                    generateAudio: { type: boolean }
                    watermark: { type: boolean }
                references:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    additionalProperties: false
                    required: [resourceId, kind]
                    properties:
                      resourceId: { type: string }
                      kind: { type: string, enum: [image, video, audio] }
                      role: { type: string, enum: [reference, first_frame, last_frame] }
                      slotKey: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /admin/workbench/tools:
    get:
      tags: [workbench, admin]
      summary: 管理工作台工具目录
      parameters:
        - in: query
          name: kind
          schema: { type: string, enum: [image, video] }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "403":
          $ref: "#/components/responses/Error"
  /tasks:
    post:
      tags: [tasks]
      summary: 创建生成任务
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
  /tasks/canvas-batch:
    post:
      tags: [tasks]
      summary: 原子提交同一画布的2至15个图片或文本任务
      description: 使用登录态与现有模型目录、额度和任务队列。每项须含稳定clientOperationId和canvasTaskDraft；可附图片批次root及其旧子节点retiredNodeIds。节点、连线、任务和费用预占一起提交，任一项无效则整体回滚。相同确认内容重放返回原任务，改变任一项仍复用原操作编号返回409；关闭页面不阻止结果回写。每个子任务计入创建限流。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tasks]
              properties:
                tasks: {type: array, minItems: 2, maxItems: 15, items: {type: object}}
                root: {type: object, description: 图片根节点草稿，包含node/connections/requireExisting}
                retiredNodeIds: {type: array, maxItems: 15, items: {type: string}}
      responses:
        "200": {description: 成功信封data.tasks按提交顺序返回原生任务，各项含clientOperationId用于对应回执}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /tasks/{id}/cancel:
    post:
      tags: [tasks]
      summary: 取消当前账号任务并持久化上游停止核对
      description: 管理员本地图片/视频渠道具有原始加密执行配置、已保存回执且未进入文件保存阶段时，可按具体回执取消。canCancelAfterSubmission仅为摘要/详情的显示提示，服务端验证原始配置归属；渠道后来编辑、停用或删除不改变原服务。历史系统渠道任务缺少原配置时提示人工核对，停止向当前渠道发送旧回执。其他渠道继续遵循提交前取消限制。本地CPU任务可在运行中取消。取消意图和回执原子落库；providerCancelStatus=requested表示确认中，confirmed表示已确认，uncertain表示需核对，不能只凭status=cancelled判断上游已停止或费用已退回。
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "返回当前任务；重复已取消请求幂等，不创建新任务或推理"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /tasks/{id}/recover-media:
    post:
      tags: [tasks]
      summary: 按原任务 ID 重试作品保存，不重新生成或创建计费订单
      description: 仅当前用户有恢复记录的保存失败任务可重入队；已在队列或运行中时幂等返回。每任务最多手动恢复三次，间隔至少一分钟。已取消、已退款或归属项目不可用时拒绝。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /tasks/{id}/text-events:
    get:
      tags: [tasks]
      summary: 文本任务 SSE
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: after
          schema: { type: integer }
          description: 递增事件游标，不要用任务 ID
      responses:
        "200":
          description: text/event-stream
  /assets:
    get:
      tags: [assets]
      summary: 用户素材库
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
  /assets/batch-delete:
    post:
      tags: [assets]
      summary: 批量彻底删除当前用户素材
      description: 顶层 JSON 数组，一次请求、一个数据库事务。所有 ID 必须属于当前用户，不受任务、画布或历史引用阻塞；共享文件保留，其余通过 Outbox 异步清理，失败重试。任一素材不存在、越权或数据库写入失败时整批不删除。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 1000
              items:
                type: string
                minLength: 1
            example: ["asset-1", "asset-2"]
      responses:
        "200":
          description: 成功信封，data.ids 返回本次请求的素材 ID 数组；物理文件清理由后台执行。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [ids]
                        properties:
                          ids:
                            type: array
                            items: { type: string }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /assets/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    delete:
      tags: [assets]
      summary: 彻底删除当前用户素材
      description: 不依赖素材 archived 状态，也不受画布、任务、项目或历史快照引用阻塞；其他素材共享的物理对象仍保留。
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /projects/{id}/timeline/cuts:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
    get:
      tags: [projects]
      summary: 分页读取原生固定剪辑版本，归档仍保护源文件
      parameters:
        - {in: query, name: archived, schema: {type: boolean, default: false}}
        - {in: query, name: includeAutomatic, description: "false时仅列主动保存的版本；自动记录仍保留，可按ID读取或重新打开此筛选。筛选先于分页。", schema: {type: boolean, default: true}}
        - {in: query, name: cursor, schema: {type: string}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        "200": {description: "信封 data 为 {cuts, nextCursor?}，不返回各版大段时间线"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    post:
      tags: [projects]
      summary: 按稳定编号保存当前工作剪辑或明确提供的原生时间线快照
      description: 版本不可改写；标签不自动改画幅、翻译或生成。相同编号用于不同内容返回409。请求未知先查询 cut-requests。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectCutCreateRequest"}
      responses:
        "200": {description: "信封 data 为 {cut, timeline, metadata?, replayed}"}
        "409": {$ref: "#/components/responses/Error"}
  /projects/{id}/timeline/caption-preview:
    post:
      tags: [projects]
      summary: 使用导出的同一字体和像素预览字幕，不创建任务、文件或素材
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [aspectRatio, clips]
              properties:
                aspectRatio: {type: string, enum: ["16:9", "9:16", "1:1", "4:3", "3:4", "3:2", "2:3", "21:9", "9:21"]}
                output: {$ref: "#/components/schemas/TimelineOutput"}
                clips:
                  type: array
                  maxItems: 128
                  items:
                    type: object
                    required: [id, kind, startMs, durationMs, text]
                    properties:
                      id: {type: string, minLength: 1, maxLength: 128}
                      kind: {type: string, enum: [subtitle, text]}
                      startMs: {type: integer, minimum: 0, maximum: 86400000}
                      durationMs: {type: integer, minimum: 1, maximum: 86400000}
                      text: {type: string, maxLength: 2000}
                      captionPresentation: {$ref: "#/components/schemas/CaptionPresentation"}
                    description: 可携带原subtitleStyle、subtitleHighlights、subtitleEntryIndex与captionOrigin样式。只读取呈现相关字段，不访问媒体地址。总请求最多512KiB。
      responses:
        "200": {description: "信封data为width、height及layers。各图层为PNG data URL、x/y/width/height、startMs/endMs和animation。全响应内存生成，像素预算4800万、PNG总量最多6MiB、最多512图层。按原节目时间展示，动画在起点后180ms内完成。"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /projects/{id}/timeline/graphic-preview:
    post:
      tags: [projects]
      summary: 预览本人项目的标题和图形叠层，复用原生导出的PNG像素
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clips]
              properties:
                aspectRatio: {type: string, default: "16:9"}
                output: {$ref: "#/components/schemas/TimelineOutput"}
                clips:
                  type: array
                  maxItems: 128
                  items:
                    type: object
                    required: [id, kind, text, startMs, durationMs, graphic]
                    properties:
                      id: {type: string, minLength: 1, maxLength: 128}
                      kind: {type: string, enum: [text]}
                      text: {type: string, maxLength: 2000}
                      startMs: {type: integer, minimum: 0, maximum: 86400000}
                      durationMs: {type: integer, minimum: 1, maximum: 86400000}
                      sourceStartMs: {type: integer, minimum: 0, maximum: 86400000}
                      graphic: {$ref: "#/components/schemas/TimelineMotionGraphic"}
      responses:
        "200": {description: "信封data含width、height与layers；图层包含clipId、image（PNG data URL）、width/height、startMs/durationMs/sourceStartMs和graphic。总请求512KiB，PNG总量6MiB、4800万像素；不写文件或创建模型任务。图片资源须归当前用户。"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /projects/{id}/timeline/canvas-cut-source:
    get:
      tags: [projects]
      summary: 分页核对关联画布中保存的原剪辑，不按当前节点猜测历史原片
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: query, name: canvasId, required: true, schema: {type: string, maxLength: 80}}
        - {in: query, name: sourceSha256, description: 后续页必须携带首屏摘要，源剪辑变化返回409, schema: {type: string, pattern: "^[a-f0-9]{64}$"}}
        - {in: query, name: cursor, schema: {type: integer, minimum: 0, default: 0}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        "200": {description: "信封data为来源画布/版本/摘要、clipCount、needsResourceCount、needsTextCount及当前clips页和nextCursor；不返回完整旧时间线。片段包含固定资源和实际可用性，重复实例分别识别。"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /projects/{id}/timeline/canvas-cut/preview:
    post:
      tags: [projects]
      summary: 预览把原画布剪辑转换为独立原生版本，保留当前工作剪辑
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CanvasCutConvertRequest"}
      responses:
        "200": {description: "信封data为cutId、来源、项目/剪辑版本、summary、固定/明确映射原片数量、补字数量、warnings和previewToken。原片尺寸时长从服务器检查，缺失原片或台词拒绝，不运行模型。"}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /projects/{id}/timeline/canvas-cut/apply:
    post:
      tags: [projects]
      summary: 确认创建独立转换剪辑，不自动载入，不更改原画布或工作时间线
      description: 锁定项目、来源画布和素材后原子保存。来源剪辑变化返回409；纯布局保存可通过相同来源摘要核对。未知响应按cut-requests的原requestId找回，不能重建项目或重放覆盖新编辑。
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/CanvasCutConvertRequest"}
                - {required: [previewToken]}
      responses:
        "200": {description: "信封data为{cut,timeline,metadata,replayed}；metadata保留原始剪辑、来源摘要、逐片段原片身份及明确补充的文字。采用结果另行预览/载入。"}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /projects/{id}/timeline/cut-requests:
    get:
      tags: [projects]
      summary: 按原保存编号找回固定版本，不读取新编辑替代原回执
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: query, name: requestId, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
      responses:
        "200": {description: "信封 data 为 {cut, timeline, metadata?, replayed:true}"}
        "404": {$ref: "#/components/responses/Error"}
  /projects/{id}/timeline/cuts/{cutId}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
      - {in: path, name: cutId, required: true, schema: {type: string}}
    get:
      tags: [projects]
      summary: 读取指定固定剪辑及其不可变时间线和来源元数据
      responses:
        "200": {description: "信封 data 为 {cut, timeline, metadata?, replayed}"}
        "404": {$ref: "#/components/responses/Error"}
    patch:
      tags: [projects]
      summary: 归档或恢复指定剪辑，不删除源文件或更改工作剪辑
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedArchived, archived]
              properties:
                expectedArchived: {type: boolean}
                archived: {type: boolean}
      responses:
        "200": {description: 更新后剪辑版本信封}
        "409": {$ref: "#/components/responses/Error"}
  /projects/{id}/timeline/cuts/{cutId}/preview:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
      - {in: path, name: cutId, required: true, schema: {type: string}}
    post:
      tags: [projects]
      summary: 只读核对载入影响，绑定当前CAS和目标内容SHA
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectCutApplyRequest"}
      responses:
        "200": {description: "信封 data 为 {cutId,title,expectedRevision,before,after,backupCutId,previewToken}，before/after 含片段、轨道、时长与SHA"}
        "409": {$ref: "#/components/responses/Error"}
  /projects/{id}/timeline/cuts/{cutId}/apply:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
      - {in: path, name: cutId, required: true, schema: {type: string}}
    post:
      tags: [projects]
      summary: 原子保留应用前剪辑、载入固定版本并记录完成回执
      description: 重放原编号不覆盖后续编辑。目标归档、内容不匹配或工作版本变化拒绝应用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/ProjectCutApplyRequest"}
                - {type: object, required: [previewToken]}
      responses:
        "200": {description: "信封 data 为 {plan,appliedRevision,replayed}，重放版本不是当前版本的保证"}
        "409": {$ref: "#/components/responses/Error"}
  /projects/{id}/timeline/cut-applies:
    get:
      tags: [projects]
      summary: 读取原载入完成回执及应用前恢复版本，不执行写入
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: query, name: requestId, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
      responses:
        "200": {description: "信封 data 为 {plan,appliedRevision,replayed:true}"}
        "404": {$ref: "#/components/responses/Error"}
  /projects/{id}/timeline/canvas-source:
    get:
      tags: [projects]
      summary: 读取同一项目画布节点的原片及字幕快照摘要
      description: 只读。节点、画布和原片必须属于当前账号且关联当前项目。摘要用于确认addCanvasNode，不接受客户端伪造字幕。节点原片、字幕或样式变化会使旧确认失效。
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: query, name: canvasId, required: true, schema: {type: string}}
        - {in: query, name: nodeId, required: true, schema: {type: string}}
        - {in: query, name: resourceId, required: true, schema: {type: string}}
      responses:
        "200": {description: "信封data为{canvasId,nodeId,canvasRevision,nodeSha256,resourceId,title,captionCount,previewCues}，预览文字最多三条"}
        "404": {$ref: "#/components/responses/Error"}
  /projects/{id}/timeline/legacy-settings/preview:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
    post:
      tags: [projects]
      summary: 核对放弃未转换旧版设置的具体影响
      description: 只读；discardFields 须逐项等于当前工作剪辑 deliveryBlockers 的排序结果。来源缺失、损坏或关系异常须先修复。返回当前画面摘要、来源、放弃字段及恢复版本编号，不运行模型。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectCutReviewRequest"}
      responses:
        "200": {description: "信封data为{cutId,backupCutId,sourceCutId,expectedRevision,before,discardFields,previewToken}"}
        "409": {$ref: "#/components/responses/Error"}
  /projects/{id}/timeline/legacy-settings/apply:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
    post:
      tags: [projects]
      summary: 明确放弃旧版设置并原子保存当前画面和恢复版本
      description: 用户核对并确认后沿用同一编号、字段、CAS及令牌。放弃不代表转换成功，不改原始档案或旧成片。相同意图重放返回旧回执，不覆盖后续剪辑；未知响应先读results。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/ProjectCutReviewRequest"}
                - {type: object, required: [previewToken]}
      responses:
        "200": {description: "信封data为{kind:legacy-settings-review,plan,appliedRevision,replayed}"}
        "409": {$ref: "#/components/responses/Error"}
  /projects/{id}/timeline/legacy-settings/results:
    get:
      tags: [projects]
      summary: 按原核对编号查询完成回执
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: query, name: requestId, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
      responses:
        "200": {description: "信封data为{kind:legacy-settings-review,plan,appliedRevision,replayed:true}；回执不代表当前剪辑仍等于该结果"}
        "404": {$ref: "#/components/responses/Error"}
  /projects/{id}/timeline/edits/preview:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
    post:
      tags: [projects]
      summary: 预览原生剪辑动作及声音、字幕跟随影响
      description: 只读。1到8个动作按顺序执行；addResource 仅接受本人已就绪资源，媒体参数由服务端读取。addCanvasNode另核对画布节点快照，采用其标题和字幕，绑定到具体新增素材实例。预览不运行模型、不保存剪辑。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TimelineEditRequest"}
      responses:
        "200": {description: "信封 data 含 cutId、backupCutId、expectedRevision、before、after、changes、timeline 和 previewToken"}
        "409": {$ref: "#/components/responses/Error"}
  /projects/{id}/timeline/edits/apply:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
    post:
      tags: [projects]
      summary: 原子保存编辑前后版本、当前剪辑及完成回执
      description: 用户核对预览后提交同一编号、动作、CAS 与令牌。相同意图重放返回原回执，不覆盖后续编辑。响应未知先查询 edit-results，不新建编号或自动运行模型。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/TimelineEditRequest"}
                - {type: object, required: [previewToken]}
      responses:
        "200": {description: "信封 data 为 {kind:timeline-edit,plan,appliedRevision,replayed}；plan 不携带时间线大对象"}
        "409": {$ref: "#/components/responses/Error"}
  /projects/{id}/timeline/edit-results:
    get:
      tags: [projects]
      summary: 核对原生编辑完成回执
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: query, name: requestId, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
      responses:
        "200": {description: "信封 data 为 {kind:timeline-edit,plan,appliedRevision,replayed:true}；回执不保证当前剪辑仍等于旧操作结果"}
        "404": {$ref: "#/components/responses/Error"}
  /projects/{id}/legacy-native:
    get:
      tags: [projects]
      summary: 查询原导入合同及当前原生转换是否完成
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        "200": {description: "信封 data 为 {available,converterVersion,originalContractVersion?,cut?}"}
        "404": {$ref: "#/components/responses/Error"}
  /projects/{id}/legacy-native/preview:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
    post:
      tags: [projects]
      summary: 核对旧工程源SHA、身份及文字稿/素材分析父版本，预览独立剪辑转换
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LegacyNativeRequest"}
      responses:
        "200": {description: "信封 data 含 converterVersion、固定 cutId/SHA、项目/时间线版本、report 和 previewToken；v11 的 report.previs 含 sceneId/nodeId、对象和关键帧数量、画布版本及转换前后 SHA。v11 仅在已有原生场景未设置路径偏好时补齐原值，保留后续编辑；旧转换回执仍指向原剪辑。令牌同时绑定当前画布，未解释字段明确列入 preservedOnly。此预览不写入。"}
        "409": {$ref: "#/components/responses/Error"}
  /projects/{id}/legacy-native/apply:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
    post:
      tags: [projects]
      summary: 原子增加独立转换剪辑、文字稿及素材分析历史，保留工作剪辑与旧回执
      description: 相同转换返回固定版本；升级保留旧剪辑、不可变来源及历史，不重置后续编辑、归档和最新校正。v10 在原画布追加可编辑导演预演及入口，画布版本与前后 SHA 校验和剪辑回执同事务提交；并发编辑、迁移或删除导致409。已有预演不会被原工程重建。构图仅使用原工程指定分析历史，未知坐标或不完整覆盖仍保留交付阻止条件。不创建识别或生成任务。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/LegacyNativeRequest"}
                - {type: object, required: [previewToken]}
      responses:
        "200": {description: "信封 data 为 {cut,timeline,metadata,replayed}"}
        "409": {$ref: "#/components/responses/Error"}
  /projects/{id}/legacy-versions:
    get:
      tags: [projects]
      summary: 分页读取原始工程档案中的剧集区域版和已转换剪辑
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: query, name: cursor, schema: {type: integer, minimum: 0, default: 0}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 20, default: 20}}
        - {in: query, name: sourceSha256, schema: {type: string, pattern: "^[a-f0-9]{64}$"}}
      responses:
        "200": {description: "data含converterVersion、sourceSha256、versions和nextCursor。每版含旧身份、集数、语言、地区、画面数量、原尺寸/帧率/fit、hasReframes、hasAttachedAudio及可选原生cut/requiresUpgrade；保留历史剪辑，并按缺少的构图、动效或声音跟随能力提示升级。后续页须携带同一来源摘要。"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /projects/{id}/legacy-versions/preview:
    post:
      tags: [projects]
      summary: 预览逐实例固定原片、字幕、声音和可解释构图的独立区域版转换
      description: v3构图绑定原工程指定分析历史与原片SHA，读取原始分析文件并核对摘要，不改写后来的人工校正。缺少原生分析历史时返回409、reason为legacy_analysis_upgrade_required，请先完成根工程原生转换。未知坐标或不完整构图继续明示保留。
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LegacyVersionRequest"}
      responses:
        "200": {description: "data为source、cutId、summary、output、preservedOnly、warnings及previewToken。未解释的高级设置明示保留档案，不能视为已转换；不写数据或调用模型。"}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /projects/{id}/legacy-versions/apply:
    post:
      tags: [projects]
      summary: 确认后增加独立区域剪辑，保留原档案和工作剪辑
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/LegacyVersionRequest"}
                - {type: object, required: [previewToken]}
      responses:
        "200": {description: "data为cut、timeline、metadata及replayed。原生身份按原导入及区域版固定，响应未知读取预览cutId或来源列表，重试不复制或覆盖后续编辑。preservedOnly非空时须原样确认清单。"}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /projects/{id}/timeline/cuts/{cutId}/renders:
    get:
      tags: [projects]
      summary: 查找固定剪辑已有的原生导出，换浏览器无需重建任务
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: path, name: cutId, required: true, schema: {type: string}}
        - {in: query, name: cursor, schema: {type: string, maxLength: 80}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 20, default: 10}}
      responses:
        "200": {description: "data为tasks和nextCursor。只返回当前用户、项目、剪辑ID与摘要完全匹配的原生渲染任务；包含历史成功、失败、取消及进行中状态，不重新排队。"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    post:
      tags: [projects]
      summary: 直接渲染固定剪辑版本并保存输出设置，不改变工作剪辑
      description: 旧区域版除缓存报告外，还从原始导入档案重新核对deliveryBlockers。较早漏报的对象映射构图、原档案缺失或变化均阻止新导出；原报告与旧成片保留。
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: path, name: cutId, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, timelineSha256]
              properties:
                requestId: {type: string, minLength: 16, maxLength: 128}
                timelineSha256: {type: string, pattern: "^[a-f0-9]{64}$"}
      responses:
        "200": {description: "data为原生timeline_render任务。任务ID按用户、项目和requestId固定；相同编号/摘要返回原任务，修改意图返回409。固定具体原片、字幕外观、尺寸、帧率和letterbox/crop/blur；未转换高级设置会阻止导出。"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /projects/{id}/timeline/cuts/{cutId}/render-request:
    get:
      tags: [projects]
      summary: 按原导出编号只读核对任务，不重新排队
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: path, name: cutId, required: true, schema: {type: string}}
