openapi: 3.0.3
info:
  title: 影策 HTTP API
  version: "1.0.0"
  description: |
    路径前缀是 `/api`。前后端一起发布，不按路径做 API 版本。

    业务 JSON 信封为 `{ code, data, msg, reason }`。`code === 0` 表示成功；失败时 HTTP status 与
    `code` 都表达失败。`code` 默认等于 HTTP 状态；同一状态下的细分原因使用 `status*100+n`
    （例如 40301 配额、42901 限流）。机器判断请用 `reason`，不要解析 `msg`。

    TypeScript 调用面仍是 `web/src/services/api` 的 `http` 模块，不从本规范生成客户端。
servers:
  - url: /api
security:
  - sessionCookie: []
tags:
  - name: meta
  - name: auth
  - name: projects
  - name: canvas
  - name: resources
  - name: tasks
  - name: assets
  - name: models
  - name: agent
  - name: admin
  - name: skills
  - name: workbench
  - name: feedback
    description: 用户反馈与管理员收件箱
  - name: referral
    description: 推广中心：推广码、邀请记录与返佣
paths:
  /projects/{projectId}:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
    patch:
      tags: [projects]
      summary: 按项目版本更新设置或创作目标
      description: creativeBrief更新必须提交expectedRevision。过期返回409和project_settings_conflict，保留原目标。其他设置字段仍使用项目设置合同。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedRevision: {type: integer, minimum: 1}
                creativeBrief: {$ref: '#/components/schemas/ProjectCreativeBrief'}
                name: {type: string}
                description: {type: string}
                aspectRatio: {type: string}
      responses:
        "200": {description: 'data={project}，项目包含creativeBriefJson及新revision'}
        "400": {$ref: '#/components/responses/Error'}
        "401": {$ref: '#/components/responses/Error'}
        "404": {$ref: '#/components/responses/Error'}
        "409": {$ref: '#/components/responses/Error'}
  /projects/{projectId}/units/{unitId}/shot-plan-source:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
      - {name: unitId, in: path, required: true, schema: {type: string}}
    get:
      tags: [projects]
      summary: 读取当前分镜方案的固定来源
      description: 返回snapshot及其sha256。snapshot包含镜头与脚本版本、素材引用、选定候选、此刻章节正文和创作目标；不声称正文是最初生成时的文本。准备生成前保存该来源，采用时原样提交摘要。
      responses:
        "200": {description: 'data={snapshot,sha256}，快照上限4MiB'}
        "401": {$ref: '#/components/responses/Error'}
        "404": {$ref: '#/components/responses/Error'}
  /projects/{projectId}/units/{unitId}/shot-plans:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
      - {name: unitId, in: path, required: true, schema: {type: string}}
    get:
      tags: [projects]
      summary: 分页读取原生历史分镜方案
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        "200": {description: 'data={versions,total,page,pageSize}，只列出archive记录，不暴露操作回执正文'}
        "401": {$ref: '#/components/responses/Error'}
        "404": {$ref: '#/components/responses/Error'}
  /projects/{projectId}/units/{unitId}/shots:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
      - {name: unitId, in: path, required: true, schema: {type: string}}
    put:
      tags: [projects]
      summary: 原子采用新分镜并保留原方案
      description: 正文上限2MiB，1至200镜头。必须保存稳定requestId、完整正文、原expectedShotIds和生成前来源expectedSourceSha256。冲突409不覆盖；同编号重放返回原结果。原镜头只标记archived，候选、素材、旧任务和已保存剪辑保留。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, expectedShotIds, expectedSourceSha256, shots]
              properties:
                requestId: {type: string, minLength: 16, maxLength: 128}
                expectedShotIds: {type: array, maxItems: 200, items: {type: string}}
                expectedSourceSha256: {type: string, pattern: '^[a-f0-9]{64}$'}
                shots:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [title, description]
                    properties:
                      title: {type: string}
                      description: {type: string}
                      durationMs: {type: integer, minimum: 0}
                      revision: {$ref: '#/components/schemas/ShotScriptInput'}
                      assetVersionIds: {type: array, maxItems: 6, items: {type: string}}
      responses:
        "200": {description: 'data={shots,backupRecordId?,replayed,current,warnings?}；current=false表示后续已有其他方案，不再次覆盖'}
        "400": {$ref: '#/components/responses/Error'}
        "401": {$ref: '#/components/responses/Error'}
        "404": {$ref: '#/components/responses/Error'}
        "409": {$ref: '#/components/responses/Error'}
  /projects/{projectId}/shot-plans/{recordId}:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
      - {name: recordId, in: path, required: true, schema: {type: string}}
    get:
      tags: [projects]
      summary: 核对固定历史方案和分页脚本
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 1}}
      responses:
        "200": {description: 'data={record,snapshot,revisions,page,pageSize}；snapshot完整，revisions每页20条'}
        "401": {$ref: '#/components/responses/Error'}
        "404": {$ref: '#/components/responses/Error'}
  /projects/{projectId}/shot-plans/{recordId}/restore:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
      - {name: recordId, in: path, required: true, schema: {type: string}}
    post:
      tags: [projects]
      summary: 恢复具体历史方案并保留当前方案
      description: 先核对历史与当前来源，用户确认后提交。恢复原镜头和候选状态，不生成新文件；章节正文、创作目标与已保存剪辑保留各自版本。未知响应沿用同一请求，旧回执不复活已被后续修改的方案。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, sourceSha256, expectedSourceSha256, expectedShotIds]
              properties:
                requestId: {type: string, minLength: 16, maxLength: 128}
                sourceSha256: {type: string, pattern: '^[a-f0-9]{64}$', description: 历史record.payloadSha256}
                expectedSourceSha256: {type: string, pattern: '^[a-f0-9]{64}$', description: 当前source.sha256}
                expectedShotIds: {type: array, maxItems: 200, items: {type: string}}
      responses:
        "200": {description: 'data={shots,sourceRecordId,backupRecordId?,replayed,current,warnings?}'}
        "400": {$ref: '#/components/responses/Error'}
        "401": {$ref: '#/components/responses/Error'}
        "404": {$ref: '#/components/responses/Error'}
        "409": {$ref: '#/components/responses/Error'}
  /projects/{projectId}/shots/{shotId}:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
      - {name: shotId, in: path, required: true, schema: {type: string}}
    delete:
      tags: [projects]
      summary: 从当前方案移除镜头并保存完整历史
      parameters:
        - {name: requestId, in: query, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
        - {name: expectedRevisionId, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: 'data={deleted:true}；原版本、候选、任务、素材引用保留在方案历史'}
        "400": {$ref: '#/components/responses/Error'}
        "409": {$ref: '#/components/responses/Error'}
  /projects/{projectId}/shots/{shotId}/intentions:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
      - {name: shotId, in: path, required: true, schema: {type: string}}
    patch:
      tags: [projects]
      summary: 只更新镜头意图或接戏状态，保留其他脚本字段
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevisionId]
              properties:
                expectedRevisionId: {type: string}
                narrative: {$ref: '#/components/schemas/ShotNarrative'}
                referenceStates: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/ShotReferenceState'}}
      responses:
        "200": {description: 'data={shot,revision}；至少提交narrative或referenceStates，省略项继承原版本'}
        "400": {$ref: '#/components/responses/Error'}
        "409": {$ref: '#/components/responses/Error'}
  /tasks/by-client-operation/{operationId}:
    parameters:
      - {name: operationId, in: path, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
    get:
      tags: [tasks]
      summary: 按原生成操作编号查询当前账号的持久任务
      description: 创建任务时可在input.metadata.clientOperationId提供稳定编号；相同用户、编号与原始请求只创建一个任务和费用预占。相同编号改变输入返回409及task_intent_changed。productionContext由后端固定项目与镜头要求，不接受客户端伪造。404不代表可安全重复付费提交。
      responses:
        "200": {description: data为原生Task，包含clientOperationId}
        "400": {$ref: '#/components/responses/Error'}
        "401": {$ref: '#/components/responses/Error'}
        "404": {$ref: '#/components/responses/Error'}
  /canvas-projects/{canvasId}/image-layer-plans:
    parameters:
      - {name: canvasId, in: path, required: true, schema: {type: string, maxLength: 80}}
    get:
      tags: [canvas, tasks]
      summary: 按当前原图分页读取已保存识图规划，不调用模型
      parameters:
        - {name: sourceNodeId, in: query, required: true, schema: {type: string, maxLength: 128}}
        - {name: resourceId, in: query, required: true, schema: {type: string, maxLength: 80}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      description: 游标绑定账号、画布和原文件。只读，不改变旧任务；待执行、无效规划和可用规划分别返回。规划源摘要必须仍匹配原图；不受任务中心最近记录条数影响。
      responses:
        "200": {description: 'data={source,entries:[{taskId,status,model,createdAt,legacy,planning}],nextCursor}；planning含source、referenceSize、referenceSha256、purpose及ready/needs_correction状态。'}
        "400": {$ref: '#/components/responses/Error'}
        "401": {$ref: '#/components/responses/Error'}
        "404": {$ref: '#/components/responses/Error'}
        "409": {$ref: '#/components/responses/Error'}
  /canvas-projects/{canvasId}/image-layer-workflows:
    parameters:
      - {name: canvasId, in: path, required: true, schema: {type: string, maxLength: 80}}
    post:
      tags: [canvas, tasks, assets]
      summary: 原子提交固定来源的后台拆层工作流
      description: 用户确认2至8层计划和积分上限后，原子保存父任务、初始子任务、画布节点及原生回执。模型使用平台渠道和原生计费，不创建用户Key。source复用原图，仅限底图；source-region仅用于前景，按原图像素免费提取；generate使用独立模型参数。后台整理尺寸、按已批准配置最多调用一次去背景、按明确区域修补底图，保存固定素材版本并提交首次原生合成。等待子任务时释放执行名额，关闭页面或重启后继续。无效透明度会提示检查，任务成功不等于模型视觉质量通过。未知回复须保持requestId与正文；原回执不复活撤销节点。正文512KiB，总原始像素不超过67108864。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, sourceNodeId, resourceId, expectedSourceSha256, maxCredits, layers]
              properties:
                requestId: {type: string, minLength: 16, maxLength: 128}
                resumeTaskId: {type: string, maxLength: 80, description: 可选的失败或取消的原拆层父任务。固定计划须相同，原任务与费用核对完成后，新建组并复用完成层和已完成提取；maxCredits仅约束本次新调用。}
                planningTaskId: {type: string, maxLength: 128, description: 可选的已保存原生识图规划。须为本人、同画布、同原节点与原文件SHA的ready规划；确认后逐层修改及原规划关联随工作流快照保留。}
                sourceNodeId: {type: string, minLength: 1, maxLength: 128}
                resourceId: {type: string, minLength: 1, maxLength: 80}
                expectedSourceSha256: {type: string, pattern: '^[a-f0-9]{64}$'}
                title: {type: string, maxLength: 240, description: UTF8字节上限240}
                maxCredits: {type: number, minimum: 0, maximum: 1000000, description: 本次图片模型报价总上限，含可选去背景；0仅允许免费模型，不包含此前独立识图规划任务}
                backgroundRegions: {type: array, maxItems: 7, items: {$ref: '#/components/schemas/ImageLayerRegion'}}
                layers:
                  type: array
                  minItems: 2
                  maxItems: 8
                  items:
                    type: object
                    additionalProperties: false
                    required: [name, method]
                    properties:
                      name: {type: string, minLength: 1, maxLength: 240, description: UTF8字节上限240}
                      method: {type: string, enum: [source, source-region, generate]}
                      region: {$ref: '#/components/schemas/ImageLayerRegion'}
                      generation: {$ref: '#/components/schemas/ImageLayerWorkflowModel'}
                      removal: {$ref: '#/components/schemas/ImageLayerWorkflowModel'}
                      visible: {type: boolean, default: true}
      responses:
        "200": {description: "data={canvasId,nodeId,taskId,childNodeIds,revision,requestSha256,replayed}；已持久受理不代表画面已完成。使用GET /tasks/{taskId}及真实画布结果查询。父任务取消会持久停止子任务并保留已完成素材，已经提交的模型费用按实际账单核对。"}
        "400": {$ref: '#/components/responses/Error'}
        "401": {$ref: '#/components/responses/Error'}
        "403": {$ref: '#/components/responses/Error'}
        "404": {$ref: '#/components/responses/Error'}
        "409": {$ref: '#/components/responses/Error'}
        "413": {$ref: '#/components/responses/Error'}
        "429": {$ref: '#/components/responses/Error'}
  /images/{resourceId}/alpha-bounds:
    parameters:
      - {name: resourceId, in: path, required: true, schema: {type: string, maxLength: 80}}
    get:
      tags: [resources]
      summary: 只读检查原图非零透明度边界
      description: "data={resourceId,source,bounds,empty,trimNeeded,rasterInfo}。source含真实SHA、方向归一化尺寸与格式；bounds为原像素整数x/y/width/height，空图时为null。rasterInfo含width/height、nonempty、opaque、transparent及transparentPixels；按真实16位alpha统计，透明像素为alpha=0，包含非空alpha=1的边缘。只读、不建任务、不调用模型。每分钟30次。"
      responses:
        "200": {description: 返回本人原文件的准确边界，不经过浏览器8位预览}
        "400": {$ref: '#/components/responses/Error'}
        "401": {$ref: '#/components/responses/Error'}
        "403": {$ref: '#/components/responses/Error'}
        "404": {$ref: '#/components/responses/Error'}
        "429": {$ref: '#/components/responses/Error'}
  /canvas-projects/{canvasId}/image-layer-groups/{nodeId}/materials:
    parameters:
      - {name: canvasId, in: path, required: true, schema: {type: string, maxLength: 80}}
      - {name: nodeId, in: path, required: true, schema: {type: string, maxLength: 128}}
    post:
      tags: [canvas, tasks, assets]
      summary: 原子提交免费透明图层素材裁剪
      description: 仅处理明确标记为transparent的前景图层，按每层实际原文件扫描非零透明度。需要裁剪的层共用一个原生多输出任务并持久回写；不需裁剪的复用原文件，全部无需裁剪时不创建任务。空层跳过并返回emptyLayerIds，全部为空时拒绝。来源必须ready且与刚读的snapshotSha256匹配。重复请求保留旧回执，不复活撤销的节点；相同来源正在排队时复用已有任务。保留16位精度和源ICC，不调用模型、不建用户Key。最多32层及67108864总源像素，正文4KiB。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, sourceGroupSha256]
              properties:
                requestId: {type: string, minLength: 16, maxLength: 128}
                sourceGroupSha256: {type: string, pattern: '^[a-f0-9]{64}$'}
      responses:
        "200": {description: "data={canvasId,nodeId,taskId?,nodeIds,emptyLayerIds,revision,sourceGroupSha256,requestSha256,replayed}。有taskId时等待任务；无taskId时已复用原文件。回执不代表当前节点仍未被撤销，须重新读画布。"}
        "400": {$ref: '#/components/responses/Error'}
        "401": {$ref: '#/components/responses/Error'}
        "403": {$ref: '#/components/responses/Error'}
        "404": {$ref: '#/components/responses/Error'}
        "409": {$ref: '#/components/responses/Error'}
        "429": {$ref: '#/components/responses/Error'}
  /canvas-projects/{canvasId}/image-layer-groups:
    parameters:
      - {name: canvasId, in: path, required: true, schema: {type: string, maxLength: 80}}
    post:
      tags: [canvas, tasks, assets]
      summary: 从已有图片原子建立图层组并提交免费合成
      description: sources按从底到顶排列，保留原节点。创建节点、原生任务、配额和回执在同一事务提交；关闭浏览器后仍生成并尝试回写。相同requestId和正文重试返回历史回执，不复活随后删除或撤销的节点。画面宽高同时省略时采用第一张原图，输出最多16777216像素。请求正文最多16KiB。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, sources]
              properties:
                requestId: {type: string, minLength: 16, maxLength: 128}
                title: {type: string, maxLength: 240, description: UTF8字节上限240}
                width: {type: integer, minimum: 1, maximum: 16777216}
                height: {type: integer, minimum: 1, maximum: 16777216}
                sources:
                  type: array
                  minItems: 1
                  maxItems: 32
                  items:
                    type: object
                    additionalProperties: false
                    required: [nodeId, resourceId]
                    properties:
                      nodeId: {type: string, minLength: 1, maxLength: 128}
                      resourceId: {type: string, minLength: 1, maxLength: 80}
      responses:
        "200": {description: "data={canvasId,nodeId,taskId,revision,requestSha256,replayed}；任务与图层组已同时持久保存"}
        "400": {$ref: '#/components/responses/Error'}
        "401": {$ref: '#/components/responses/Error'}
        "403": {$ref: '#/components/responses/Error'}
        "404": {$ref: '#/components/responses/Error'}
        "409": {$ref: '#/components/responses/Error'}
        "413": {$ref: '#/components/responses/Error'}
        "429": {$ref: '#/components/responses/Error'}
  /canvas-projects/{canvasId}/image-layer-groups/{nodeId}/source:
    parameters:
      - {name: canvasId, in: path, required: true, schema: {type: string, maxLength: 80}}
      - {name: nodeId, in: path, required: true, schema: {type: string, maxLength: 128}}
    get:
      tags: [canvas, resources]
      summary: 读取图层组当前精确来源及可用状态
      description: "data={canvasId,nodeId,canvasRevision,resourceId,source,composition,layerSources,snapshotSha256,ready}。source及每层source含实际sha256,width,height,orientation,format；composition见ImageComposition。摘要固定所有具体源文件及布局，排除名称、工作区位置及无关修订；ready核对原生任务、固定输出及嵌套图层，客户端缓存标志不能代替此校验。"
      responses:
        "200": {description: 返回本人原生图层组来源，pending预览的ready为false}
        "400": {$ref: '#/components/responses/Error'}
        "401": {$ref: '#/components/responses/Error'}
        "403": {$ref: '#/components/responses/Error'}
        "404": {$ref: '#/components/responses/Error'}
        "409": {$ref: '#/components/responses/Error'}
        "429": {$ref: '#/components/responses/Error'}
  /images/operations/{taskId}/apply:
    parameters:
      - {name: taskId, in: path, required: true, schema: {type: string}}
    post:
      tags: [tasks, canvas, assets]
      summary: 将已完成的本地图片处理结果采用到原画布
      description: 无需活动浏览器，沿用原生画布操作、配额、历史和幂等回执。普通操作新增固定版本节点；绑定图层组的compose仅回写精确匹配的原组，保留子图层及工作区位置尺寸。普通采用按requestId去重；绑定合成任务的采用效果在worker、网页、MCP间唯一，换requestId也不会重复回写或取消后续撤销。已删画布、换图或布局变化时保留结果素材，拒绝覆盖。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId]
              properties:
                requestId: {type: string, minLength: 16, maxLength: 128, description: 本次采用意图的幂等编号}
                editProofs:
                  type: array
                  maxItems: 32
                  description: 沿用原生画布编辑租约证明，图片媒体写入不改变文本字段
                  items: {type: object}
      responses:
        "200": {description: "data={taskId,canvasId,requestSha256,addedNodeIds,existingNodeIds,updatedNodeIds?,revision,replayed}；replayed表示旧回执，当前画布内容应重新读取"}
        "400": {$ref: '#/components/responses/Error'}
        "401": {$ref: '#/components/responses/Error'}
        "403": {$ref: '#/components/responses/Error'}
        "404": {$ref: '#/components/responses/Error'}
        "409": {description: 来源或结果节点已改变，不覆盖当前内容}
        "429": {$ref: '#/components/responses/Error'}
  /images/operations:
    post:
      tags: [tasks, resources, assets]
      summary: 在影策后台处理已有图片，不调用模型
      description: 固定源SHA256、EXIF朝向与像素配方，复用原生队列、配额、资源及素材版本。相同用户及requestId重复提交返回原任务，变更参数返回409。关闭浏览器不取消任务。仅支持静态PNG/JPEG/WebP，源文件不超过32MB及16777216像素；生成PNG且保留原文件。结果通过GET /tasks/{id}读取，包含images和imageOperation快照。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, resourceId, recipe]
              properties:
                requestId: {type: string, minLength: 16, maxLength: 128, description: 操作幂等标识，限制按UTF8字节计算}
                projectId: {type: string, maxLength: 80, description: 本人未归档项目或画布，可省略}
                sourceNodeId: {type: string, maxLength: 128, description: 网页采用结果时匹配的原图节点}
                resourceId: {type: string, minLength: 1, maxLength: 80, description: 本人已就绪的源图片资源}
                expectedSourceSha256: {type: string, pattern: '^[a-f0-9]{64}$', description: 可选原文件SHA；不匹配时拒绝提交，避免把旧像素坐标用于新文件}
                sourceGroupSha256: {type: string, pattern: '^[a-f0-9]{64}$', description: compose绑定图层组时必须使用刚读取的精确来源摘要}
                clientCompositeSignature: {type: string, minLength: 1, maxLength: 8192, description: 绑定组时的界面布局签名，须和sourceGroupSha256一起提供}
                recipe:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      required: [operation, split]
                      properties:
                        operation: {type: string, enum: [split]}
                        split:
                          type: object
                          additionalProperties: false
                          required: [rows, columns]
                          properties:
                            rows: {type: integer, minimum: 1, maximum: 12}
                            columns: {type: integer, minimum: 1, maximum: 12}
                            horizontalLines: {type: array, maxItems: 11, items: {type: number, exclusiveMinimum: true, minimum: 0, exclusiveMaximum: true, maximum: 1}}
                            verticalLines: {type: array, maxItems: 11, items: {type: number, exclusiveMinimum: true, minimum: 0, exclusiveMaximum: true, maximum: 1}}
                    - type: object
                      additionalProperties: false
                      required: [operation, crop]
                      properties:
                        operation: {type: string, enum: [crop]}
                        crop:
                          type: object
                          additionalProperties: false
                          required: [x, y, width, height]
                          properties:
                            x: {type: number, minimum: 0, maximum: 1}
                            y: {type: number, minimum: 0, maximum: 1}
                            width: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 1}
                            height: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 1}
                    - type: object
                      additionalProperties: false
                      required: [operation, cropPixels]
                      properties:
                        operation: {type: string, enum: [crop]}
                        cropPixels:
                          type: object
                          additionalProperties: false
                          required: [x, y, width, height]
                          properties:
                            x: {type: integer, minimum: 0}
                            y: {type: integer, minimum: 0}
                            width: {type: integer, minimum: 1, maximum: 16777216}
                            height: {type: integer, minimum: 1, maximum: 16777216}
                    - type: object
                      additionalProperties: false
                      required: [operation, resize]
                      properties:
                        operation: {type: string, enum: [resize]}
                        resize:
                          type: object
                          additionalProperties: false
                          required: [targetLongEdge, algorithm]
                          properties:
                            targetLongEdge: {type: integer, minimum: 1, maximum: 4096}
                            algorithm: {type: string, enum: [nearest, bilinear, high]}
                    - type: object
                      additionalProperties: false
                      required: [operation, mask]
                      properties:
                        operation: {type: string, enum: [mask]}
                        mask:
                          type: object
                          additionalProperties: false
                          required: [width, height, mode, strokes]
                          properties:
                            width: {type: integer, minimum: 1, maximum: 16777216, description: 必须与方向归一化后的原图一致，总像素最多16777216}
                            height: {type: integer, minimum: 1, maximum: 16777216}
                            mode: {type: string, enum: [keep, remove], description: 保留选中区域或使其透明，原图像素坐标}
                            strokes:
                              type: array
                              minItems: 1
                              maxItems: 256
                              description: 全部笔画合计最多8192个采样点；计算量有额外上限，请求正文最多256KiB
                              items:
                                type: object
                                additionalProperties: false
                                required: [diameter, erase, points]
                                properties:
                                  diameter: {type: number, minimum: 1, maximum: 4096}
                                  erase: {type: boolean, description: 仅擦除之前的选区笔画}
                                  points: {type: array, minItems: 1, maxItems: 8192, items: {type: array, minItems: 2, maxItems: 2, items: {type: number, minimum: -4096, maximum: 16781312}}}
                    - type: object
                      additionalProperties: false
                      required: [operation, compose]
                      properties:
                        operation: {type: string, enum: [compose]}
                        compose: {$ref: '#/components/schemas/ImageComposition'}
                    - type: object
                      additionalProperties: false
                      required: [operation, region]
                      properties:
                        operation: {type: string, enum: [region]}
                        region: {$ref: '#/components/schemas/ImageLayerRegion'}
                    - type: object
                      additionalProperties: false
                      required: [operation, normalize]
                      properties:
                        operation: {type: string, enum: [normalize]}
                        normalize:
                          type: object
                          additionalProperties: false
                          required: [width, height, algorithm]
                          properties:
                            width: {type: integer, minimum: 1, maximum: 16777216}
                            height: {type: integer, minimum: 1, maximum: 16777216}
                            algorithm: {type: string, enum: [bilinear, high]}
                          description: 原图比例差不超过1%，整理至明确像素尺寸；尺寸已相同时要求直接复用原文件
                    - type: object
                      additionalProperties: false
                      required: [operation, patch]
                      properties:
                        operation: {type: string, enum: [background-patch]}
                        patch:
                          type: object
                          additionalProperties: false
                          required: [width, height, generatedResourceId, generatedSha256, regions]
                          properties:
                            width: {type: integer, minimum: 1, maximum: 16777216}
                            height: {type: integer, minimum: 1, maximum: 16777216}
                            generatedResourceId: {type: string, minLength: 1, maxLength: 80}
                            generatedSha256: {type: string, pattern: '^[a-f0-9]{64}$'}
                            regions: {type: array, minItems: 1, maxItems: 7, items: {$ref: '#/components/schemas/ImageLayerRegion'}}
                          description: 两张本人图片均完整不透明且尺寸相同，只采用确认区域中的新内容；保留选区外精确样本和原图色彩配置，不支持的色彩转换会明确拒绝
      responses:
        "200": {description: 返回原生image_operation任务；完成后每张输出具有resourceId、assetId、assetVersionId和piece像素区域；配方与实际源SHA持久保存。绑定compose有imageLayerDeliveryStatus及imageLayerDeliveryJson，状态为pending/applied/detached，分别表示待回写/已回写/保留独立素材。基础设施或配额失败保留pending待恢复，不把旧预览标记完成}
        "400": {$ref: '#/components/responses/Error'}
        "401": {$ref: '#/components/responses/Error'}
        "404": {$ref: '#/components/responses/Error'}
        "409": {description: 幂等编号对应不同参数，reason=image_operation_conflict}
        "429": {$ref: '#/components/responses/Error'}
        "503": {$ref: '#/components/responses/Error'}
  /tasks/history:
    get:
      tags: [tasks]
      summary: 搜索与分页读取本人完整创作历史
      description: 返回 data={tasks,page,pageSize,total,stats,canvases,models}。数据库执行全部历史的筛选和计数，不截取最近30条后搜索。stats不受status筛选影响，其余筛选与结果相同；今日统计按指定IANA时区计算。stats.recorded单独统计text_replay对话存档，不视为推理成功；存档不进入模型队列。画布和模型选项来自本人全部历史，不依赖当前页或浏览器缓存。摘要使用同一受保护字段投影，不包含完整输入或结果，画布标题不跨用户读取。
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: q, in: query, description: 提示词、任务编号、模型或本人画布名称，百分号与下划线按字面搜索, schema: {type: string, maxLength: 1024}}
        - {name: projectId, in: query, schema: {type: string, maxLength: 80}}
        - {name: kind, in: query, schema: {type: string, enum: [text, image, video, audio]}}
        - {name: model, in: query, schema: {type: string, maxLength: 512}}
        - {name: status, in: query, schema: {type: string, enum: [active, succeeded, failed, recorded]}}
        - {name: timeZone, in: query, schema: {type: string, maxLength: 80, default: UTC}}
      responses:
        "200": {description: 本人全部历史的分页摘要、真实计数及筛选选项}
        "400": {$ref: '#/components/responses/Error'}
        "401": {$ref: '#/components/responses/Error'}
  /tasks/page:
    get:
      tags: [tasks]
      summary: 按创建时间和任务ID分页读取本人任务摘要
      description: 返回 data={tasks,nextCursor?}。游标绑定项目、类型和活动任务筛选；修改筛选后应重新读取第一页。摘要不包含受保护输入和完整结果，详情仍经本人授权的任务读取接口获取。状态更新不改变分页排序。canvasContext.status=available 时包含本人原生画布 title 和所属 projectId；unavailable 不泄露其他用户的名称，也不表示已确认删除。数据库读取失败返回错误，不伪装成画布不存在。
      parameters:
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: projectId, in: query, schema: {type: string, maxLength: 80}}
        - {name: type, in: query, schema: {type: string, maxLength: 64}}
        - {name: activeOnly, in: query, schema: {type: boolean}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 1024}}
      responses:
        "200": {description: "data={tasks,nextCursor?}；到最后一页省略nextCursor"}
        "400": {$ref: '#/components/responses/Error'}
        "401": {$ref: '#/components/responses/Error'}
  /projects/{projectId}/shots:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
    post:
      tags: [projects]
      summary: 创建镜头或按期望脚本版本更新镜头
      description: 更新必须提交 id 与读取时的 currentRevisionId 作为 expectedRevisionId。缺失版本返回400，过期版本返回409、reason=shot_revision_conflict；不覆盖脚本或新增历史。新增镜头省略id。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                id: {type: string}
                expectedRevisionId: {type: string}
                unitId: {type: string}
                title: {type: string, minLength: 1}
                description: {type: string}
                position: {type: integer, minimum: 0}
                durationMs: {type: integer, minimum: 0}
                status: {type: string}
                revision: {$ref: '#/components/schemas/ShotScriptInput'}
      responses:
        "200": {description: "data={shot}"}
        "400": {$ref: '#/components/responses/Error'}
        "401": {$ref: '#/components/responses/Error'}
        "404": {$ref: '#/components/responses/Error'}
        "409": {$ref: '#/components/responses/Error'}
  /projects/{projectId}/shots/{shotId}/revisions:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
      - {name: shotId, in: path, required: true, schema: {type: string}}
    post:
      tags: [projects]
      summary: 按期望版本新增镜头脚本历史
      description: 过期版本返回409、reason=shot_revision_conflict。读取接口返回的currentRevisionId必须原样提交，不自动覆盖新版。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/ShotScriptInput'}
                - type: object
                  required: [expectedRevisionId]
                  properties:
                    expectedRevisionId: {type: string}
      responses:
        "200": {description: "data={shot,revision}"}
        "400": {$ref: '#/components/responses/Error'}
        "401": {$ref: '#/components/responses/Error'}
        "404": {$ref: '#/components/responses/Error'}
        "409": {$ref: '#/components/responses/Error'}
  /projects/{projectId}/shots/{shotId}/video-source:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
      - {name: shotId, in: path, required: true, schema: {type: string}}
    patch:
      tags: [projects]
      summary: 保存镜头视频的文字、资产或具体首帧来源
      description: 来源为 text、assets 或 frame:具体候选ID。首帧须为同一镜头本人可读的就绪图片候选，允许明确采用旧脚本候选。归档候选不可用。请求不提交推理。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, expectedSource]
              properties:
                source: {type: string, maxLength: 100}
                expectedSource: {type: string, description: "读取时的来源，尚未选择时为空字符串"}
      responses:
        "200": {description: "data={shot}，保存后重开仍使用这一具体首帧"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /projects/{projectId}/shots/{shotId}/artifacts/{artifactId}:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
      - {name: shotId, in: path, required: true, schema: {type: string}}
      - {name: artifactId, in: path, required: true, schema: {type: string}}
    patch:
      tags: [projects]
      summary: 选用、归档或恢复镜头候选
      description: 仅改变候选偏好，不修改具体时间线片段或删除资源。当前选用及作为固定首帧的候选不可归档。恢复不自动选用，采用 stale 候选保留其旧脚本状态。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, expectedSelectedId]
              properties:
                action: {type: string, enum: [select, archive, restore]}
                expectedSelectedId: {type: string, description: "同镜头同类型当前选用候选ID，无选用版本时为空字符串"}
      responses:
        "200": {description: "data={artifact}"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /projects/{projectId}/timeline:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [projects]
      summary: 读取项目剪辑及服务端版本，空项目不创建记录
      responses:
        "200": {description: "data={revision,timeline,exists,updatedAt?}"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    put:
      tags: [projects]
      summary: 校验固定素材并按期望版本保存项目剪辑
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, timeline]
              properties:
                expectedRevision: {type: integer, minimum: 0}
                timeline: {type: object, description: "v2 剪辑文档，上限 8 MiB、64 轨、5000 片段、24 小时；媒体固定影策资源"}
      responses:
        "200": {description: 保存后返回新的完整版本}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {description: "reason=project_timeline_revision_conflict；保留草稿后重新读取"}
  /media-analyses/capabilities:
    get:
      tags: [projects]
      summary: 检查实际安装且认证通过的本地 CPU 分析服务，不运行模型
      responses:
        "200": {description: "data={available,engineVersion,actions,reason?,maxSourceBytes,maxIntervalMs,maxTrackingIntervalMs,maxReferenceIntervalMs}"}
        "401": {$ref: "#/components/responses/Error"}
  /projects/{projectId}/media-analyses/tasks:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
    post:
      tags: [projects, tasks]
      summary: 固定原素材摘要与分析服务版本后，创建持久 CPU 分析任务
      description: 不生成图片或视频，不创建模型 Key，不计模型费用；任务仍受任务和存储配额约束。原文件不修改；同一 requestId 重试返回原任务，不同意图返回409。常规分段与节拍最多60秒，人工框选主体跟踪最多120秒；reference_video显式启用longReference时最多30分钟，以重叠区间检查点续跑。源文件最多1GiB。sourceClipId 固定源区间；startMs/endMs 为源文件绝对毫秒。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, resourceId, kind, options]
              properties:
                requestId: {type: string, minLength: 16, maxLength: 128}
                resourceId: {type: string}
                sourceClipId: {type: string, maxLength: 128}
                title: {type: string, maxLength: 240}
                kind: {type: string, enum: [reference_video, audio_structure, subject_track]}
                longReference: {type: boolean, default: false, description: 仅reference_video，最多30分钟；重叠区间检查点持久保存并在恢复同一任务时复用，不自动核对结果}
                startMs: {type: integer, minimum: 0}
                endMs: {type: integer, minimum: 1}
                options:
                  type: object
                  additionalProperties: false
                  properties:
                    threshold: {type: number, minimum: 0.15, maximum: 0.95, description: 仅参考片分段}
                    roi: {$ref: "#/components/schemas/AnalysisRectangle"}
                    anchorTimeMs: {type: integer, minimum: 0, description: 主体跟踪的源绝对起始时间}
                    targetAspect: {type: number, minimum: 0.25, maximum: 4}
      responses:
        "200": {description: 原生任务，私有服务认证配置不会返回客户端}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /projects/{projectId}/media-analyses/manual-framing:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
    post:
      tags: [projects]
      summary: 创建待人工核对的原生构图草稿，不运行跟踪或生成模型
      description: 验证视频实际显示尺寸、原始摘要及已保存的片段版本。区间为50毫秒至120秒；草稿为固定画幅的起终点，可在校正版本添加中间点。初始建议未核对，不能直接采用。同一requestId和正文重试返回现有草稿当前版本，不覆盖后续修改；编号复用不同正文返回409。跟踪服务不可用时仍可使用，受原生存储配额约束。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, resourceId, sourceClipId, expectedTimelineRevision]
              properties:
                requestId: {type: string, minLength: 16, maxLength: 128}
                resourceId: {type: string}
                sourceClipId: {type: string, maxLength: 128}
                expectedTimelineRevision: {type: integer, minimum: 1}
                startMs: {type: integer, minimum: 0}
                endMs: {type: integer, minimum: 1}
                targetAspect: {type: number, minimum: 0.1, maximum: 10, description: 未指定时使用项目画幅}
                title: {type: string, maxLength: 240}
      responses:
        "200": {description: "data={view,replayed}；sourceKind=manual_framing，无生成任务或模型费用"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /projects/{projectId}/media-analyses:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
    get:
      tags: [projects]
      summary: 按创建时间与ID分页读取项目分析，游标绑定筛选和归属
      parameters:
        - {name: resourceId, in: query, schema: {type: string}}
        - {name: kind, in: query, schema: {type: string, enum: [reference_video, audio_structure, subject_track]}}
        - {name: archived, in: query, schema: {type: boolean, default: false}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        "200": {description: "data={analyses,nextCursor?}；列表不包含原始证据和完整校正文档"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /projects/{projectId}/media-analyses/{analysisId}:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
      - {name: analysisId, in: path, required: true, schema: {type: string}}
    get:
      tags: [projects]
      summary: 读取固定来源、不可变测量及当前或指定校正版本
      parameters:
        - {name: revisionId, in: query, schema: {type: string}}
      responses:
        "200": {description: "data={analysis,currentVersion,source,evidence,document,isCurrent}；Cache-Control private,no-store"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    put:
      tags: [projects]
      summary: CAS保存校正、改名、归档，或将历史校正另存新版本
      description: 最大2MiB；不能写入来源和原始证据。requestId绑定完整修改意图；响应丢失后相同意图重试返回原版本回执及最新视图。归档记录需先恢复才可编辑。恢复版本与直接传document不能同时提交。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, expectedRevision]
              properties:
                requestId: {type: string, minLength: 16, maxLength: 128}
                expectedRevision: {type: integer, minimum: 1}
                title: {type: string, minLength: 1, maxLength: 240}
                archived: {type: boolean}
                document: {$ref: "#/components/schemas/MediaAnalysisEdits"}
                restoreRevisionId: {type: string}
                note: {type: string, maxLength: 240}
      responses:
        "200": {description: "data={view,appliedVersion,replayed}"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {description: "reason=media_analysis_revision_changed 或 media_analysis_request_conflict；保留草稿"}
        "413": {$ref: "#/components/responses/Error"}
        "428": {description: 缺少expectedRevision}
  /projects/{projectId}/reference-adoptions:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
    get:
      tags: [projects]
      summary: 根据稳定请求编号找回参考分镜采用回执
      parameters:
        - {name: requestId, in: query, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
      responses:
        "200": {description: "data={plan,replayed,missingShotIds,unitDeleted}；已删除章节仍保留原始回执与来源"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /projects/{projectId}/media-analyses/{analysisId}/shots/preview:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
      - {name: analysisId, in: path, required: true, schema: {type: string}}
    post:
      tags: [projects]
      summary: 预览已核对参考分段规划为新章节及镜头
      description: 固定分析当前具体版本和项目版本，选择1至200个已核对分段。省略sectionIds时使用全部已核对分段；显式空数组无效。时长来自原片，候选不代表剧情理解。不运行生成模型。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, analysisRevisionId, expectedProjectRevision]
              properties:
                requestId: {type: string, minLength: 16, maxLength: 128}
                analysisRevisionId: {type: string, maxLength: 80}
                expectedProjectRevision: {type: integer, minimum: 1}
                title: {type: string, maxLength: 240}
                sectionIds: {type: array, minItems: 1, maxItems: 200, uniqueItems: true, items: {type: string}}
      responses:
        "200": {description: "data={adoptionId,projectRevision,analysisId,analysisRevisionId,resourceId,sourceSha256,unitId,title,position,shots,warnings,previewToken}"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /projects/{projectId}/media-analyses/{analysisId}/shots/apply:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
      - {name: analysisId, in: path, required: true, schema: {type: string}}
    post:
      tags: [projects]
      summary: 原子创建参考章节、镜头版本、原生工作流和采用回执
      description: 必须先检查同一版本预览。相同requestId及完全相同内容重试返回原回执，保留后续编辑；编号用于其他内容返回409。原章节已删除返回410，不复建。回执受原生结构化存储配额约束。响应未知时先读取reference-adoptions回执。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, analysisRevisionId, expectedProjectRevision, previewToken]
              properties:
                requestId: {type: string, minLength: 16, maxLength: 128}
                analysisRevisionId: {type: string, maxLength: 80}
                expectedProjectRevision: {type: integer, minimum: 1}
                title: {type: string, maxLength: 240}
                sectionIds: {type: array, minItems: 1, maxItems: 200, uniqueItems: true, items: {type: string}}
                previewToken: {type: string, pattern: '^[a-f0-9]{64}$'}
      responses:
        "200": {description: "data={plan,replayed,missingShotIds,unitDeleted}"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "410": {description: 原采用章节已删除，旧编号不会重新创建}
  /projects/{projectId}/media-analyses/{analysisId}/history:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
      - {name: analysisId, in: path, required: true, schema: {type: string}}
    get:
      tags: [projects]
      summary: 按版本倒序读取不可变校正历史
      parameters:
        - {name: beforeVersion, in: query, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        "200": {description: "data={versions,nextBeforeVersion?}"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /projects/{projectId}/media-analyses/{analysisId}/reframe/preview:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
      - {name: analysisId, in: path, required: true, schema: {type: string}}
    post:
      tags: [projects]
      summary: 预览人工核对跟踪到一个片段的构图；原始测量及其他实例保留
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MediaAnalysisMarkerRequest"}
      responses:
        "200": {description: "data={timeline,beforeTimeline,reframe,replaced,sourceClipId,warnings,analysisId,analysisRevisionId,timelineRevision,previewToken}"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /projects/{projectId}/media-analyses/{analysisId}/reframe/apply:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
      - {name: analysisId, in: path, required: true, schema: {type: string}}
    post:
      tags: [projects]
      summary: 使用精确版本、预览令牌及时间线CAS采用构图
      description: 网页以原生命令和保存队列实现撤销。丢失或遮挡点须人工校正，不能只勾选核对。构图源时间必须覆盖片段。响应未知先读取，不自动重试旧预览。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/MediaAnalysisMarkerRequest"}
                - type: object
                  required: [previewToken]
                  properties:
                    previewToken: {type: string, pattern: "^[a-f0-9]{64}$"}
      responses:
        "200": {description: 新的项目时间线与版本}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /projects/{projectId}/media-analyses/{analysisId}/markers/preview:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
      - {name: analysisId, in: path, required: true, schema: {type: string}}
    post:
      tags: [projects]
      summary: 将已核对分段或节拍映射到一个片段实例，返回替换范围和预览令牌
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MediaAnalysisMarkerRequest"}
      responses:
        "200": {description: "data={timeline,beforeTimeline,added,removedIds,sourceClipId,warnings,analysisId,analysisRevisionId,timelineRevision,previewToken}"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /projects/{projectId}/media-analyses/{analysisId}/markers/apply:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
      - {name: analysisId, in: path, required: true, schema: {type: string}}
    post:
      tags: [projects]
      summary: Agent使用与网页同一计划及时间线CAS采用标记；网页通过命令保存以保留撤销
      description: 失败不自动重试；读取当前时间线确认结果。重复旧计划返回409，不重新插回已撤销的标记。仅采用参考标记，不剪切画面、不改音轨。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/MediaAnalysisMarkerRequest"}
                - type: object
                  required: [previewToken]
                  properties:
                    previewToken: {type: string, pattern: "^[a-f0-9]{64}$"}
      responses:
        "200": {description: 新的项目时间线与版本}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /projects/{projectId}/transcripts:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
    get:
      tags: [projects]
      summary: 分页读取本人项目文字稿，包括显式归档筛选
      parameters:
        - {name: resourceId, in: query, schema: {type: string}}
        - {name: archived, in: query, schema: {type: boolean, default: false}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 30}}
      responses:
        "200": {description: "data={transcripts,nextCursor?}；按创建时间和ID降序，摘要不含全文"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    post:
      tags: [projects]
      summary: 从本项目已成功的识别任务幂等创建原生文字稿
      description: 固定源素材ETag、大小和时长；重复提交返回既有校正版本；不再次调用识别模型。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [taskId]
              properties:
                taskId: {type: string, maxLength: 80}
                title: {type: string, maxLength: 240}
      responses:
        "200": {description: "data={transcript,currentVersion,document}；document含segments、可选words及真实precision"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
  /projects/{projectId}/transcripts/by-task/{taskId}:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
      - {name: taskId, in: path, required: true, schema: {type: string}}
    get:
      tags: [projects]
      summary: 按识别任务读取已保存文字稿，不创建记录
      responses:
        "200": {description: "data={transcript,currentVersion,document}"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /projects/{projectId}/transcripts/{transcriptId}:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
      - {name: transcriptId, in: path, required: true, schema: {type: string}}
    get:
      tags: [projects]
      summary: 读取当前文字稿及版本
      responses:
        "200": {description: "data={transcript,currentVersion,document}"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "500": {description: "reason=transcript_document_unreadable；details含transcriptId和expectedRevision，可继续读取有效历史并恢复"}
    patch:
      tags: [projects]
      summary: 按期望版本校正文字、改名、归档或恢复历史
      description: 请求上限2MiB；只允许修改句子文字与手动说话人，拒绝修改源时间或未知字段。历史恢复追加版本，不覆盖旧快照。归档仍保护源素材。校正或恢复不会自动更新已采用字幕。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision]
              properties:
                expectedRevision: {type: integer, minimum: 1}
                title: {type: string, minLength: 1, maxLength: 240}
                changes:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [id]
                    properties:
                      id: {type: string}
                      text: {type: string, minLength: 1, maxLength: 8000}
                      speaker: {type: string, maxLength: 80}
                action: {type: string, enum: [archive, restore, restore_version]}
                restoreRevisionId: {type: string}
                note: {type: string, maxLength: 240}
      responses:
        "200": {description: "返回新完整版本；无变化不追加版本；归档与改名不复制全文"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {description: "reason=transcript_revision_conflict；保留草稿后重新读取"}
        "413": {$ref: "#/components/responses/Error"}
  /projects/{projectId}/transcripts/{transcriptId}/suggestions:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
      - {name: transcriptId, in: path, required: true, schema: {type: string}}
    get:
      tags: [projects]
      summary: 检查具体已保存文字稿版本的停顿和相邻重复文字
      description: 纯规则检查，不调用模型，不修改文字或媒体。超过800毫秒的句间空隙只作提示；相邻相同文字需要预听，手动标注为不同说话人的相同对白不作重复提示。不自动识别说话人。
      parameters:
        - {name: revisionId, in: query, schema: {type: string, maxLength: 80}, description: "省略则读取当前已保存版本"}
      responses:
        "200": {description: "data={transcriptId,revisionId,method:review_rules,suggestions:[{id,kind:pause|repeat,segmentId,previousSegmentId,startMs,endMs}]}。时间为源时间。"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /projects/{projectId}/transcripts/{transcriptId}/cut-preview:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
      - {name: transcriptId, in: path, required: true, schema: {type: string}}
    post:
      tags: [projects]
      summary: 按文字稿具体版本预览真实媒体剪切，返回受影响片段和完整结果
      description: 不修改剪辑或原文件。支持普通速度的音视频实例及按句或真实逐词时间选择；逐词时间不完整或文字已校正时拒绝按词剪辑。拒绝越权、未知条目、锁定的受影响轨道及变速片段。ripple让所有受影响轨道跟随剪切；clip_only仅处理选中实例及关联字幕，保持其他轨道原位置。preservePauses只保留相邻且均选中的条目之间的间隙，不恢复未选中的内容；首尾未选时间仍剪除。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedTimelineRevision, transcriptRevisionId, sourceClipId, mode]
              properties:
                expectedTimelineRevision: {type: integer, minimum: 0}
                transcriptRevisionId: {type: string, maxLength: 80}
                sourceClipId: {type: string, maxLength: 128}
                mode: {type: string, enum: [ripple, clip_only]}
                unit: {type: string, enum: [segment, word], default: segment}
                preservePauses: {type: boolean, default: false}
                keepSegmentIds: {type: array, minItems: 1, maxItems: 10000, uniqueItems: true, items: {type: string}}
                keepWordIds: {type: array, minItems: 1, maxItems: 100000, uniqueItems: true, items: {type: string}, description: "unit=word时使用；不能同时提交keepSegmentIds"}
      responses:
        "200": {description: "data={mode,sourceClipId,removedMs,beforeDurationMs,afterDurationMs,keptRanges,changes,warnings,timeline,beforeTimeline,timelineRevision,transcriptId,transcriptRevisionId,previewToken}。范围同时包含源时间和节目时间；受影响字幕重新绑定分段后的具体媒体实例。"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {description: "reason=project_timeline_revision_conflict；剪辑已更新，必须重新预览"}
        "413": {$ref: "#/components/responses/Error"}
  /projects/{projectId}/transcripts/{transcriptId}/cut-apply:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
      - {name: transcriptId, in: path, required: true, schema: {type: string}}
    post:
      tags: [projects]
      summary: 按已确认预览应用文字媒体剪切，供Agent等服务端调用方使用
      description: 使用相同规划器和时间线CAS保存边界。参数变化或令牌不符拒绝；重复过期请求返回409，不再次剪切。编辑器将同一预览作为一次原生命令保存，保留撤销历史。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedTimelineRevision, transcriptRevisionId, sourceClipId, mode, previewToken]
              properties:
                expectedTimelineRevision: {type: integer, minimum: 0}
                transcriptRevisionId: {type: string, maxLength: 80}
                sourceClipId: {type: string, maxLength: 128}
                mode: {type: string, enum: [ripple, clip_only]}
                unit: {type: string, enum: [segment, word], default: segment}
                preservePauses: {type: boolean, default: false}
                keepSegmentIds: {type: array, minItems: 1, maxItems: 10000, uniqueItems: true, items: {type: string}}
                keepWordIds: {type: array, minItems: 1, maxItems: 100000, uniqueItems: true, items: {type: string}, description: "unit=word时使用；不能同时提交keepSegmentIds"}
                previewToken: {type: string, minLength: 64, maxLength: 64}
      responses:
        "200": {description: "返回新的项目剪辑版本；原素材和文字稿不变"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {description: "reason=project_timeline_revision_conflict；过期应用不会覆盖新剪辑"}
        "413": {$ref: "#/components/responses/Error"}
  /projects/{projectId}/transcripts/{transcriptId}/versions:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
      - {name: transcriptId, in: path, required: true, schema: {type: string}}
    get:
      tags: [projects]
      summary: 分页读取文字稿版本摘要
      parameters:
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 30}}
        - {name: beforeVersion, in: query, schema: {type: integer, minimum: 1}}
      responses:
        "200": {description: "data={versions,nextBeforeVersion?}；按版本降序，不含全文"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /projects/{projectId}/transcripts/{transcriptId}/versions/{revisionId}:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
      - {name: transcriptId, in: path, required: true, schema: {type: string}}
      - {name: revisionId, in: path, required: true, schema: {type: string}}
    get:
      tags: [projects]
      summary: 读取具体历史正文，当前版本损坏时仍可恢复
      responses:
        "200": {description: "data={transcript,currentVersion,document}；currentVersion是所选历史版本，transcript.revision仍是父记录当前CAS令牌"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /timeline/transcriptions:
    post:
      tags: [tasks]
      summary: 对已授权素材创建本地语音识别任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resourceId]
              properties:
                projectId: {type: string}
                resourceId: {type: string}
                sourceClipId: {type: string, maxLength: 128, description: 指定时必须属于已保存的项目剪辑且绑定同一素材}
                language: {type: string, description: 可选语言代码，缺省自动识别}
      responses:
        "200": {description: "返回原生任务；结果含 segments/srt/language/resourceId/sourceClipId，字幕采用由用户确认"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /timeline/renders:
    post:
      tags: [tasks]
      summary: 按固定剪辑快照和输出画幅合成画面、声音和字幕
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timeline]
              properties:
                projectId: {type: string}
                aspectRatio: {type: string, enum: ["16:9", "9:16", "1:1", "4:3", "3:4", "3:2", "2:3", "21:9", "9:21"], description: "省略时使用项目默认画幅，入队时固定；旧任务无此字段时保留横屏默认值"}
                timeline: {type: object, description: "v2 剪辑，单次最多 128 段；含素材归属、时间、音轨和字幕布局检查"}
      responses:
        "200": {description: "返回本地任务；成功 resultJson 含 resourceId/fileName/size/durationMs/subtitleSrt/width/height/fps"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /projects/legacy/inspect:
    post:
      tags: [projects]
      summary: 检查旧 Studio 完整工程包，不创建项目或任务
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "200":
          description: data 含 sourceFingerprint、节点/候选/文件清单、missingMediaIds、readyForMigration 和原生映射 projection；文件完整不等于全部高级设定已迁入
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
  /projects/legacy/import:
    post:
      tags: [projects]
      summary: 幂等导入旧 Studio 工程到当前用户的影策项目
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, fingerprint]
              properties:
                file: {type: string, format: binary}
                fingerprint: {type: string, minLength: 64, maxLength: 64}
                name: {type: string, maxLength: 200}
      responses:
        "200":
          description: data={receipt,report,reused}；report.preservedOnly 明确尚只能保留快照的设定；历史任务不重新入队
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
  /projects/{id}/assets/{assetId}/image:
    put:
      tags: [projects, assets]
      summary: 为场景或道具绑定图片并创建新版本
      description: 校验项目归属、资产关联、版本归属与就绪图片资源；过期版本拒绝。旧版本与图片引用保留。
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: path, name: assetId, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resourceId, expectedVersionId]
              properties:
                resourceId: {type: string, minLength: 1}
                expectedVersionId: {type: string, minLength: 1}
      responses:
        "200":
          description: 成功信封 data={asset}，包含 visual.definition/status 和新版本、图片资源定位
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
  /admin/login-logs:
    get:
      tags: [admin]
      summary: 管理员分页查询用户登录登出日志
      description: 按时间倒序，保留用户快照；失败账号脱敏，无密码、验证码或会话凭据。
      parameters:
        - {in: query, name: keyword, schema: {type: string, maxLength: 160}, description: 用户名、昵称、脱敏账号或用户 ID}
        - {in: query, name: event, schema: {type: string, enum: [login, logout]}}
        - {in: query, name: method, schema: {type: string, enum: [password, email, sms, linuxdo, verification, unknown]}}
        - {in: query, name: result, schema: {type: string, enum: [success, failed]}}
        - {in: query, name: ip, schema: {type: string}, description: 精确匹配 IPv4 或 IPv6}
        - {in: query, name: from, schema: {type: string, format: date-time}, description: 包含开始时刻，RFC3339}
        - {in: query, name: to, schema: {type: string, format: date-time}, description: 包含结束时刻，RFC3339}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: pageSize, schema: {type: integer, minimum: 1, default: 20}}
      responses:
        "200":
          description: 成功信封 data={logs,total,page,pageSize}
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: integer, enum: [0]}
                  msg: {type: string}
                  data:
                    type: object
                    properties:
                      logs: {type: array, items: {$ref: "#/components/schemas/LoginLog"}}
                      total: {type: integer}
                      page: {type: integer}
                      pageSize: {type: integer}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
  /admin/login-logs/{id}:
    get:
      tags: [admin]
      summary: 管理员读取单条登录日志详情
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        "200":
          description: 成功信封 data.log
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: integer, enum: [0]}
                  msg: {type: string}
                  data:
                    type: object
                    properties:
                      log: {$ref: "#/components/schemas/LoginLog"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
  /feedbacks:
    post:
      tags: [feedback]
      summary: 提交用户反馈
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FeedbackSubmission"}
      responses:
        "200":
          description: 成功信封，data 为新建反馈
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/UserFeedback"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
  /feedbacks/my:
    get:
      tags: [feedback]
      summary: 读取当前用户自己的反馈列表
      responses:
        "200":
          description: 成功信封，data 为按创建时间倒序排列的反馈数组
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: "#/components/schemas/UserFeedback"}
        "401": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
  /feedbacks/attachments:
    post:
      tags: [feedback]
      summary: 上传用户反馈图片或视频附件
      description: 单文件最大 50 MiB；整个 multipart 请求体最大 55 MiB。文件交由现有资源服务保存。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "200":
          description: 成功信封，data 为附件元数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/FeedbackAttachment"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
  /admin/feedbacks:
    get:
      tags: [feedback, admin]
      summary: 管理员筛选和分页查询反馈
      parameters:
        - {in: query, name: type, schema: {type: string, enum: [all, bug, feature, improvement, other]}}
        - {in: query, name: status, schema: {type: string, enum: [all, pending, processing, resolved, closed, archived]}}
        - {in: query, name: keyword, schema: {type: string}, description: 匹配标题、正文、用户名或联系方式}
        - {in: query, name: archived, schema: {type: boolean}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: pageSize, schema: {type: integer, minimum: 1, default: 20}, description: 大于 100 时服务端使用默认值 20}
      responses:
        "200":
          description: 成功信封，data 含 list、total、page、limit
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/FeedbackListResult"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
  /admin/feedbacks/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
    patch:
      tags: [feedback, admin]
      summary: 更新反馈状态、答复或归档标志
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FeedbackAdminUpdate"}
      responses:
        "200":
          description: 成功信封，data 为更新后的反馈
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/UserFeedback"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
    delete:
      tags: [feedback, admin]
      summary: 删除反馈记录
      responses:
        "200":
          description: 成功信封 data={ok:true}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ok: {type: boolean, enum: [true]}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
  /admin/feedbacks/{id}/archive:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
    post:
      tags: [feedback, admin]
      summary: 归档反馈
      responses:
        "200": {$ref: "#/components/responses/Envelope"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
  /admin/feedbacks/{id}/unarchive:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
    post:
      tags: [feedback, admin]
      summary: 取消归档反馈
      responses:
        "200": {$ref: "#/components/responses/Envelope"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}

  /admin/settings/appearance/live2d:
    post:
      tags: [admin]
      summary: 导入管理员 Live2D 模型草稿（不自动启用）
      description: ZIP 最大 128 MiB，最多 256 条目；解压累计 384 MiB，单文件最大 128 MiB。只接受一个 Version 3 model3.json 及 ZIP 内 MOC3、PNG、JSON 引用。启用通过 PATCH /admin/settings/appearance 的 canvas 配置完成。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "200":
          description: 成功信封 data.model 包含 resourceId 和服务端确认的 entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: integer, enum: [0]}
                  msg: {type: string}
                  data:
                    type: object
                    properties:
                      model:
                        type: object
                        required: [resourceId, entry]
                        properties:
                          resourceId: {type: string}
                          entry: {type: string}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /admin/settings/appearance/live2d/{id}/{file}:
    get:
      tags: [admin]
      summary: 读取模型草稿文件（管理员所有者或当前配置引用）
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: path, name: file, required: true, description: ZIP 内相对路径，可包含多级目录, schema: {type: string}}
      responses:
        "200": {description: JSON、PNG 或 MOC3 文件，非 JSON 信封}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /public/appearance/live2d/{id}/{file}:
    get:
      tags: [meta]
      security: []
      summary: 读取当前启用的 Live2D 模型文件
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: path, name: file, required: true, description: ZIP 内相对路径，可包含多级目录, schema: {type: string}}
      responses:
        "200": {description: JSON、PNG 或 MOC3 文件，非 JSON 信封；停用后拒绝公开读取}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /admin/settings/appearance/avatar-bundles:
    post:
      tags: [admin]
      summary: 导入 Agent 状态动画 ZIP 草稿（不自动启用）
      description: ZIP 最大 128 MiB，解压累计最大 384 MiB、最多 128 个条目；根目录须包含 version 1 的 avatar.json 和其引用的 MP4。上传后需通过 PATCH /admin/settings/appearance 配置 avatarBundleResourceId 与 avatarClipStates 才会公开播放。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "200":
          description: 成功信封 data.bundle 包含 resourceId 和已校验 manifest
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: integer, enum: [0]}
                  msg: {type: string}
                  data:
                    type: object
                    properties:
                      bundle:
                        type: object
                        required: [resourceId, manifest]
                        properties:
                          resourceId: {type: string}
                          manifest:
                            type: object
                            required: [version, width, height, clips]
                            properties:
                              version: {type: integer, enum: [1]}
                              width: {type: integer, minimum: 1, maximum: 4096}
                              height: {type: integer, minimum: 1, maximum: 4096}
                              clips: {type: object, additionalProperties: {type: string}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /admin/settings/appearance/avatar/{id}/{file}:
    get:
      tags: [admin]
      summary: 预览动画包文件（上传者或当前配置引用的管理员）
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: path, name: file, required: true, description: avatar.json 或 manifest 引用的 MP4 文件名, schema: {type: string}}
      responses:
        "200": {description: JSON 或 MP4 原始内容，支持 MP4 Range 请求}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /public/appearance/avatar/{id}/{file}:
    get:
      tags: [meta]
      security: []
      summary: 读取当前启用的 Agent 动画包文件
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: path, name: file, required: true, description: avatar.json 或 manifest 引用的 MP4 文件名, schema: {type: string}}
      responses:
        "200": {description: JSON 或 MP4 原始内容，支持 Range；停用后拒绝公开读取}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /tools:
    get:
      tags: [canvas]
      summary: 列出可见且启用的生成工具
      parameters:
        - {in: query, name: scope, schema: {type: string, enum: [public, favorites, custom], default: public}}
        - {in: query, name: type, schema: {type: string, enum: [style, motion, nine_grid, effect]}}
        - {in: query, name: tag, schema: {type: string}}
        - {in: query, name: search, schema: {type: string}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: pageSize, schema: {type: integer, minimum: 1, maximum: 80, default: 20}}
      responses:
        "200": {description: "标准信封 data 为 tools（摘要不含 prompt/extraInfo）、totalCount、page、pageSize、hasMore"}
        "401": {description: 未登录}
    post:
      tags: [canvas]
      summary: 创建当前用户的工具
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ToolMutation'}
      responses:
        "200": {description: 标准信封 data 为完整工具}
        "400": {description: 参数无效或预览资源不符合要求}
        "401": {description: 未登录}
  /skills/presets:
    get:
      tags: [canvas]
      security: []
      summary: 获取公开场景技能预设目录
      responses:
        "200":
          description: 标准信封 data 为 presets 数组；预设只引用公开且启用的种子技能
        "500": {$ref: "#/components/responses/Error"}
  /skills/recommendations:
    get:
      tags: [skills]
      summary: 按行业列出推荐安装的内置技能
      responses:
        "200": {description: "标准信封 data 为 {industries, installedTotal}；每个行业含 industryId、name、description、icon、installedCount 和 skills（skillId、skillName、description、tag、reason、isAdded）。只读目录，不会自动安装"}
        "401": {$ref: "#/components/responses/Error"}
  /skills/recommendations/{industryId}/install:
    parameters:
      - {in: path, name: industryId, required: true, description: 推荐行业 ID, schema: {type: string}}
    post:
      tags: [skills]
      summary: 把某个行业的推荐技能加入当前用户技能库
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                skillIds:
                  type: array
                  maxItems: 12
                  items: {type: string}
                  description: 只安装其中这些技能；传 {} 或空数组时安装该行业全部推荐
      responses:
        "200": {description: "标准信封 data 为 {industryId, installed, skipped}；已安装、已删除或不在该行业推荐里的技能计入 skipped，不报错"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /skills:
    get:
      tags: [skills]
      summary: 列出技能；在个人技能视图按技能库分类筛选
      parameters:
        - {in: query, name: scope, schema: {type: string, enum: [public, mine, created, favorites], default: public}}
        - {in: query, name: libraryCategoryId, description: 用户技能库分类 ID，仅支持 mine 或 created 视图；与 libraryUncategorized 互斥, schema: {type: string}}
        - {in: query, name: libraryUncategorized, description: 仅列出未归类技能，仅支持 mine 或 created 视图；与 libraryCategoryId 互斥, schema: {type: boolean}}
      responses:
        "200": {description: 标准信封 data 为技能列表及分页信息；categories 含共享分类 value、label 和技能广场公开技能 count}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /skills/library-categories:
    get:
      tags: [skills]
      summary: 获取当前用户可见的技能库分类和数量
      parameters:
        - {in: query, name: scope, schema: {type: string, enum: [mine, created], default: mine}}
      responses:
        "200": {description: 标准信封 data 为 categories、totalCount、uncategorizedCount；分类含 id、name、scope、count}
        "401": {$ref: "#/components/responses/Error"}
    post:
      tags: [skills]
      summary: 创建个人或平台技能库分类
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 64}
                scope: {type: string, enum: [personal, platform], default: personal}
      responses:
        "200": {description: 标准信封 data.category 为新分类}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /skills/library-categories/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
    delete:
      tags: [skills]
      summary: 删除技能库分类并解除相关技能归类，不删除技能
      responses:
        "200": {description: "标准信封 data 为 {deleted: true}"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /skills/{id}/agent-mode:
    parameters:
      - {in: path, name: id, required: true, description: 技能 ID, schema: {type: string}}
    patch:
      tags: [skills]
      summary: 设置已安装技能是否进入 Agent 自动发现目录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: {type: string, enum: [auto, manual], description: auto 进入技能目录由 Agent 按任务自动发现；manual 只在用户固定或点名时使用}
      responses:
        "200": {description: 标准信封 data.skill 为更新后的技能}
        "400": {description: mode 无效，或技能未安装（自建技能除外）}
        "401": {$ref: "#/components/responses/Error"}
        "404": {description: 技能不存在或对当前用户不可见}
  /skills/{id}/library-category:
    parameters:
      - {in: path, name: id, required: true, description: 技能 ID, schema: {type: string}}
    patch:
      tags: [skills]
      summary: 为当前用户已加入或自建的技能设置/清除技能库分类
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoryId]
              properties:
                categoryId: {type: string, description: 个人分类或可见平台分类 ID；空字符串表示取消归类}
      responses:
        "200": {description: 标准信封 data.skill 为更新后的技能}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /skills/{id}/files:
    parameters:
      - {in: path, name: id, required: true, description: 技能 ID, schema: {type: string}}
    put:
      tags: [skills]
      summary: 作者批量写入、重命名或删除技能包文本文件，并生成新的技能版本
      description: 按顺序应用 operations 后重建 ZIP 与文件清单；SKILL.md 变化时同步 instruction。baseVersionId 必须等于当前版本，否则返回 409 skill_version_conflict，details.currentVersionId 为最新版本。GitHub 技能返回 409 failed_precondition。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseVersionId, operations]
              properties:
                baseVersionId: {type: string, description: 编辑开始时读取到的 versionId}
                operations:
                  type: array
                  minItems: 1
                  maxItems: 256
                  items:
                    type: object
                    required: [op, path]
                    properties:
                      op: {type: string, enum: [write, rename, delete]}
                      path: {type: string, description: 规范化相对路径，最多 8 层，不允许 .. / 绝对路径 / .git / 控制字符}
                      to: {type: string, description: rename 的目标路径}
                      content: {type: string, description: write 的 UTF-8 文本，单文件不超过 512KB}
      responses:
        "200": {description: 标准信封 data 为 skill、files 与 changed；内容未变化时 changed=false 且不生成版本}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /tools/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer, format: int64, minimum: 1}}
    get:
      tags: [canvas]
      summary: 查询可见且启用工具的完整详情
      responses:
        "200": {description: 标准信封 data 为完整工具，包含 prompt 和 extraInfo}
        "404": {description: 工具不存在或不可见}
    delete:
      tags: [canvas]
      summary: 删除自己的用户工具及关联收藏，不删除预览文件
      responses:
        "200": {description: "标准信封 data 为 {deleted: true}"}
        "404": {description: 工具不存在或不能删除}
  /tools/{id}/favorite:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer, format: int64, minimum: 1}}
    post:
      tags: [canvas]
      summary: 幂等收藏可见工具
      responses:
        "200": {description: 标准信封 data 为完整工具和收藏状态}
        "404": {description: 工具不存在或不可见}
    delete:
      tags: [canvas]
      summary: 幂等取消收藏可见工具
      responses:
        "200": {description: 标准信封 data 为完整工具和收藏状态}
        "404": {description: 工具不存在或不可见}
  /model-catalog:
    get:
      tags: [models]
      summary: 获取创作端模型目录
      description: |
        固定 source=system，channels 直接来自系统渠道下的模型列表，models 为空数组；不反查逻辑模型。
        一级跨渠道按 displayName 分组，二级显示 channelLabel；模型请求仍使用 channelId + modelKey 定位。
        channelLabel 是后台渠道模型创建和更新时配置的渠道展示名，去除首尾空白后最多 80 字，空字符串表示使用所属渠道名称。
        description 是后台渠道模型创建和更新时填写的公开模型描述，去除首尾空白后最多 500 字；空字符串表示未填写。
        displayName 和 icon 用于一级模型菜单，channelLabel 不参与路由、权限或计费。
        渠道级 publicAlias 已废弃；成本配置和成本快照仅供管理端，不包含在本接口及用户报价中。
      responses:
        "200":
          description: 当前启用的模型目录
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    enum: [0]
                  msg:
                    type: string
                  data:
                    type: object
                    required: [source, models, channels]
                    properties:
                      source:
                        type: string
                        enum: [system]
                      models:
                        type: array
                        items:
                          type: object
                      channels:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            displayName:
                              type: string
                            models:
                              type: array
                              items:
                                type: object
                                properties:
                                  modelKey:
                                    type: string
                                  displayName:
                                    type: string
                                  icon:
                                    type: string
                                  channelLabel:
                                    type: string
                                    maxLength: 80
                                    default: ""
                                  tags:
                                    type: array
                                    maxItems: 5
                                    description: 后台模型创建及更新使用同名字段；文字去除首尾空白且不能重复，空数组清除标签，仅用于展示。
                                    items:
                                      type: object
                                      required: [text, color]
                                      properties:
                                        text:
                                          type: string
                                          minLength: 1
                                          maxLength: 12
                                        color:
                                          type: string
                                          enum: [purple, blue, green, gold, orange, pink]
                                  description:
                                    type: string
                                    maxLength: 500
                                    default: ""
        "401":
          $ref: "#/components/responses/Error"
  /model-catalog/quote:
    post:
      tags: [models]
      summary: 按当前参数预估系统渠道模型费用
      description: |
        需要登录会话 Cookie。仅接受启用的系统渠道和模型，采用服务端能力默认值及价格档选择规则。
        不创建任务或账单、不冻结或扣除积分，也不调用模型供应商。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId, modelKey, intent]
              properties:
                channelId:
                  type: string
                  minLength: 1
                modelKey:
                  type: string
                  minLength: 1
                  description: 系统渠道中配置的模型键
                intent:
                  $ref: "#/components/schemas/ModelRequestIntent"
      responses:
        "200":
          $ref: "#/components/responses/ModelQuote"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /models/{id}/quote:
    post:
      tags: [models]
      summary: 按当前参数预估前台模型费用
      description: |
        需要登录会话 Cookie。请求正文直接为创作意图，不使用 intent 外层包装。
        服务端按前台模型能力、默认参数、供应线路和价格策略报价，不创建任务、账单或积分冻结。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: 前台逻辑模型 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelRequestIntent"
      responses:
        "200":
          $ref: "#/components/responses/ModelQuote"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /canvas-projects/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [canvas]
      summary: 读取当前用户画布内容和 revision
      responses:
        "200":
          description: 信封 data.project 包含完整画布及服务端 revision
        "304":
          description: If-None-Match 命中当前 revision，正文为空
        "404":
          description: 画布不存在或不属于当前用户
    delete:
      tags: [canvas]
      summary: 显式删除当前用户画布
      description: 删除后迟到的媒体回写和编辑操作不会重新创建画布；只有新的 create_canvas operation 可以显式创建同 ID 画布。
      responses:
        "200":
          description: 画布已删除，信封 data.id 返回画布 ID
        "401":
          description: 未登录
        "404":
          description: 画布不存在或不属于当前用户
  /canvas-projects/{id}/history:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
    get:
      tags: [canvas]
      summary: 查询拥有的画布历史版本
      description: 返回最近20个快照的摘要和currentRevision，正文不在列表内；私有响应不缓存。
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /canvas-projects/{id}/history/{snapshotId}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
      - {in: path, name: snapshotId, required: true, schema: {type: string}}
    get:
      tags: [canvas]
      summary: 预览拥有的画布具体历史版本
      description: 信封data包含snapshot摘要和project原始画布正文，不跨用户或画布读取。
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /canvas-projects/{id}/history/{snapshotId}/restore:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
      - {in: path, name: snapshotId, required: true, schema: {type: string}}
    post:
      tags: [canvas]
      summary: 恢复具体画布版本并保留恢复前的快照
      description: 必须传入当前expectedRevision；并发修改报409，缺少版本报428。保留当前项目归属、所有者和创建时间；原生资源守卫及编辑租约继续生效。未知网络结果不自动重试。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision]
              properties:
                expectedRevision: {type: integer, minimum: 0}
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "428":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /canvas-projects/{id}/sync-status:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [canvas]
      summary: 读取当前用户画布版本、输入租约及 Agent 占用状态
      description: 需要登录并拥有画布。仅返回 revision、服务端时间、有效租约和 Agent 控制字段，不返回 token、完整画布或 Agent 对话正文；WebSocket 通知后校验状态，连接正常且无活动 Agent 时每三十秒补偿读取，断线或活动 Agent 期间恢复前台两秒、后台十五秒非重叠查询。版本变化后再读取正文。
      responses:
        "200":
          description: 信封 data 含 revision、serverTime、leases 和可空的 agent；每项租约含 nodeId、sessionId、expiresAt，agent 只含 runId、status、cleanupPending
        "401":
          description: 未登录
        "404":
          description: 画布不存在或不属于当前用户
  /canvas-projects/{id}/realtime:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [canvas]
      summary: 建立画布多窗口光标、拖拽预览与同步通知 WebSocket
      description: 使用登录 Cookie，校验画布归属和 Origin。welcome 返回 selfId/peers，每个 peer 包含服务端分配的 number（1–64），同一会话在各窗口编号一致且存续期间不变；Redis 模式跨实例分配并续期临时编号。客户端发送世界坐标 presence，服务端广播 peer/leave/invalidate/heartbeat。光标与拖拽预览不入库，invalidate 只在事务提交后发送，收到后通过 sync-status 校准。协议细节见画布操作同步专题。
      responses:
        "101":
          description: 已升级到 WebSocket
        "401":
          description: 未登录
        "403":
          description: 来源不允许
        "404":
          description: 画布不存在或不属于当前用户
        "503":
          description: 实时服务暂不可用，客户端保留 HTTP 同步
  /canvas-projects/{id}/edit-lease:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [canvas]
      summary: 获取、续期或释放节点文字编辑租约
      description: 需要登录并拥有画布。服务端有效期 30 秒，实际输入才获取；续期与释放必须携带当前 token。请求最大 2048 字节，每用户每分钟最多 240 次；过期持有者不能影响新持有者。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, nodeId, sessionId]
              properties:
                action:
                  type: string
                  enum: [acquire, renew, release]
                nodeId:
                  type: string
                  minLength: 1
                  maxLength: 160
                sessionId:
                  type: string
                  minLength: 1
                  maxLength: 160
                token:
                  type: string
                  maxLength: 80
      responses:
        "200":
          description: 信封 data 含 serverTime；获取及续期额外返回 lease 和 token，释放不返回 token
        "400":
          description: 参数无效
        "401":
          description: 未登录
        "404":
          description: 画布不存在或不属于当前用户
        "409":
          description: reason 为 canvas_edit_lease_conflict；节点被其他窗口占用或证明已过期
        "429":
          description: 请求超过频率限制
  /canvas-projects/{id}/operations:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    patch:
      tags: [canvas]
      summary: 按对象或字段变更写入画布
      description: |
        请求只提交对象级或字段级 operations，不提交整批画布快照。
        mutationId 是一次请求的幂等身份；响应丢失、断网、刷新或后台重试时必须复用同一个 mutationId 与原始 operations。
        更新、删除和连接操作要求目标存在并通过对象基线校验；同一字段冲突不会覆盖远端修改。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mutationId, operations]
              properties:
                mutationId:
                  type: string
                  minLength: 1
                  maxLength: 160
                  description: 一次写入请求的幂等身份
                baseRevision:
                  type: integer
                  format: int64
                  minimum: 0
                  description: 生成 operations 时已确认的画布 revision，用于诊断和响应
                editProofs:
                  type: array
                  maxItems: 500
                  description: 本次修改涉及节点的编辑证明，节点不可重复；不计入 mutation 摘要，原请求 receipt 可在租约过期后重放
                  items:
                    type: object
                    required: [nodeId, sessionId, token]
                    properties:
                      nodeId: { type: string, minLength: 1, maxLength: 160 }
                      sessionId: { type: string, minLength: 1, maxLength: 160 }
                      token: { type: string, minLength: 1, maxLength: 80 }
                operations:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [type]
                    additionalProperties: true
                    description: create_canvas、create_node、patch_node、remove_node、create_connection、update_connection、remove_connection 或 set_field
      responses:
        "200":
          description: 信封 data.project 返回当前画布摘要，data.mutationId 返回原 mutationId
        "400":
          description: 请求、字段、对象基线或素材引用格式不合法
        "401":
          description: 未登录
        "404":
          description: 画布不存在或不属于当前用户，且请求未包含显式 create_canvas
        "409":
          description: 对象并发冲突、同一 mutationId 对应的请求摘要不同或编辑证明失效（reason 为 canvas_edit_lease_conflict）；原事务不会被覆盖
        "428":
          description: 缺少执行所需的对象基线
  /public/welcome:
    get:
      tags: [meta]
      security: []
      summary: 读取欢迎页开放状态
      responses:
        "200":
          description: 信封 data 仅包含 welcomeEnabled 布尔值，默认 true；Cache-Control 为 no-store
        "500":
          description: 配置读取失败
  /agent/capabilities:
    get:
      tags: [agent]
      summary: 读取云端 Agent 能力
      responses:
        "200":
          description: 信封 data 包含 version、permissionModes、contextScopes、skills、writeTools、billing、maxHistoryPairs、maxSteps、maxHistoryBytes、capabilitySetVersion、capabilitySetHash、nodeTypes、tools；maxHistoryPairs 为跨轮保留的用户对话轮数，maxSteps 为 0 表示无固定模型调用上限，历史仍受 maxHistoryBytes 限制
  /agent/skills/usage:
    get:
      tags: [agent]
      summary: 读取当前用户技能的使用统计（由运行日志聚合，只读）
      responses:
        "200":
          description: 信封 data 含 scannedRuns、searchCalls 与按启用次数降序的 skills；每个技能含 runsEnabled、searchHits、readCalls、readFailures、entryReads、cardReads 与 topCards（最多 5 条最热卡路径）。统计仅覆盖调用方本人最近的运行，且不含任何技能正文
        "401":
          description: 未登录
  /agent/profile:
    get:
      tags: [agent]
      summary: 读取生效的用户、项目、画布 Agent 偏好层
      parameters:
        - in: query
          name: scope
          schema:
            type: string
            enum: [user, project, canvas]
        - in: query
          name: projectId
          schema:
            type: string
        - in: query
          name: canvasId
          schema:
            type: string
      responses:
        "200":
          description: 信封 data 为合并 revision、hash 和按 user/project/canvas 顺序排列的 layers；每层含独立数字 revision
        "403":
          description: 项目或画布不属于当前用户
    patch:
      tags: [agent]
      summary: 使用单层 revision CAS 更新 Agent 偏好
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentProfileRequest"
      responses:
        "200":
          description: 返回更新后的生效偏好视图
        "409":
          description: 偏好 revision 已变化，须重新读取后保存
  /agent/memory:
    get:
      tags: [agent]
      summary: 读取当前用户的 Agent 记忆文件
      responses:
        "200": {description: "标准信封 data 为 {mode, capacity, charCount, revision, entries, pendingCount, updatedAt}；entries 每条含 id、section（user|notes）、text"}
        "401": {$ref: "#/components/responses/Error"}
    put:
      tags: [agent]
      summary: 用户整体保存记忆文件（按 revision CAS）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, entries]
              properties:
                revision: {type: integer, format: int64, description: 读取时的 revision；不一致返回 409}
                entries:
                  type: array
                  maxItems: 80
                  items:
                    type: object
                    required: [section, text]
                    properties:
                      id: {type: string, description: 保留原条目 ID；新条目留空}
                      section: {type: string, enum: [user, notes]}
                      text: {type: string, description: 单条最多 400 字}
      responses:
        "200": {description: 返回保存后的记忆文件；总量不得超过 capacity（5000 字），疑似密钥或敏感内容返回 400}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {description: 记忆文件已被 Agent 或其他页面修改，须重新读取}
  /agent/memory/settings:
    patch:
      tags: [agent]
      summary: 设置记忆模式
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: {type: string, enum: [auto, review, off], description: auto 直接写入并可撤销；review 先暂存待确认；off 不注入也不提供写入工具}
      responses:
        "200": {description: 返回更新后的记忆文件}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /agent/memory/revisions:
    get:
      tags: [agent]
      summary: 列出记忆文件的修改记录
      parameters:
        - {in: query, name: status, schema: {type: string, enum: [applied, pending, rejected]}}
        - {in: query, name: limit, description: 默认 50, schema: {type: integer, minimum: 1, maximum: 200}}
      responses:
        "200": {description: "标准信封 data.revisions；每条含 id、actor（agent|user|restore|seed|admin）、runId、status、summary、baseRevision、revision、changes、canUndo、createdAt"}
        "401": {$ref: "#/components/responses/Error"}
  /agent/memory/revisions/{revisionId}/undo:
    parameters:
      - {in: path, name: revisionId, required: true, schema: {type: string}}
    post:
      tags: [agent]
      summary: 撤销一次已生效的修改（恢复到修改前快照，并记一条 restore 修订）
      responses:
        "200": {description: 返回撤销后的记忆文件}
        "400": {description: 修订未生效、已撤销或本身就是撤销；或撤销后会超过记忆容量}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {description: 这条修改涉及的条目之后又被改过，无法自动撤销}
  /agent/memory/revisions/{revisionId}/decide:
    parameters:
      - {in: path, name: revisionId, required: true, schema: {type: string}}
    post:
      tags: [agent]
      summary: 采纳或拒绝 review 模式下的待确认修改
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [approve, reject]}
      responses:
        "200": {description: 返回处理后的记忆文件}
        "400": {description: decision 无效，或这条修改已经处理过}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {description: 记忆文件已在待确认修改之后变化，须重新查看}
  /agent/memories:
    get:
      tags: [agent]
      summary: 列出当前用户的 Agent 记忆
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected, expired]
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: 当前用户的记忆，含可选来源运行与工具执行证据；计数不是有效性评分
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [memories]
                        properties:
                          memories:
                            type: array
                            items: { $ref: "#/components/schemas/AgentMemory" }
        "401":
          $ref: "#/components/responses/Error"
    post:
      tags: [agent]
      summary: 手动添加一条个人记忆（直接批准）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic, category, situation]
              properties:
                topic: { type: string }
                category: { type: string }
                situation: { type: string }
                lesson: { type: string }
                source: { type: string }
                steps:
                  type: array
                  items:
                    type: object
                    properties:
                      tool: { type: string }
                      action: { type: string }
                      note: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /agent/memories/export:
    get:
      tags: [agent]
      summary: 导出当前用户的 Agent 记忆
      responses:
        "200":
          description: 信封 data 为 version/kind/exportedAt/memories
        "401":
          $ref: "#/components/responses/Error"
  /agent/memories/import:
    post:
      tags: [agent]
      summary: 导入 Agent 记忆 JSON
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: integer }
                kind: { type: string }
                memories: { type: array }
      responses:
        "200":
          description: 信封 data 含 imported、merged、skipped
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /agent/memories/settings:
    get:
      tags: [agent]
      summary: 读取当前用户的记忆压缩设置与最近一次压缩状态
      responses:
        "200":
          description: 压缩设置与最新提案状态；awaiting_review 不表示记忆已经修改
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AgentMemoryCompactView" }
        "401":
          $ref: "#/components/responses/Error"
    patch:
      tags: [agent]
      summary: 更新记忆压缩周期和文本模型
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                compactInterval:
                  type: string
                  enum: [off, daily, weekly, monthly]
                logicalModelId: { type: string }
                channelId: { type: string }
                channelModelKey: { type: string }
                model: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /agent/memories/compact:
    post:
      tags: [agent]
      summary: 生成一次待审批的个人记忆压缩提案（走用户文本模型计费）
      description: 每批最多80条、输入最多48KiB，按稳定ID公平轮转。模型回调只保存提案，不修改已批准记忆；需由本人带version批准才应用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                logicalModelId: { type: string }
                channelId: { type: string }
                channelModelKey: { type: string }
                model: { type: string }
      responses:
        "200":
          description: 信封 data 为含 taskId/proposalId 的压缩设置视图；通常为 queued，快速完成时可已进入 awaiting_review
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AgentMemoryCompactView" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /agent/memories/proposals:
    get:
      tags: [agent]
      summary: 列出当前用户的记忆压缩提案
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: 按创建时间倒序的用户私有压缩提案
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [proposals]
                        properties:
                          proposals:
                            type: array
                            items: { $ref: "#/components/schemas/AgentMemoryProposal" }
        "401":
          $ref: "#/components/responses/Error"
  /agent/memories/proposals/{proposalId}/decide:
    parameters:
      - in: path
        name: proposalId
        required: true
        schema: { type: string }
    post:
      tags: [agent]
      summary: 按版本批准或拒绝当前用户的压缩提案
      description: 批准前锁定全部源记忆并比较输入快照，任一内容或状态变化时整批409且不留下部分修改。批准保留完整恢复版本；拒绝不改变记忆。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentMemoryProposalDecision" }
      responses:
        "200":
          description: 操作成功后的压缩提案视图
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AgentMemoryProposal" }
        "400":
          description: 缺少或无效version、决定无效或请求包含未知字段
        "401":
          $ref: "#/components/responses/Error"
        "404":
          description: 对象不存在或不属于当前用户
        "409":
          description: version或记忆内容前置条件不匹配；整批未执行
  /agent/memories/revisions:
    get:
      tags: [agent]
      summary: 列出当前用户的记忆可恢复版本
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: 按创建时间倒序的用户私有可恢复版本
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [revisions]
                        properties:
                          revisions:
                            type: array
                            items: { $ref: "#/components/schemas/AgentMemoryRevision" }
        "401":
          $ref: "#/components/responses/Error"
  /agent/memories/revisions/{revisionId}/restore:
    parameters:
      - in: path
        name: revisionId
        required: true
        schema: { type: string }
    post:
      tags: [agent]
      summary: 按版本恢复一次已应用压缩前的记忆
      description: 要求全部保留条目仍匹配应用后快照，且被删除ID未被复用；有后续编辑、删除或ID复用时整批409。不能覆盖他人记录，同一版本只成功恢复一次。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentMemoryRevisionRestore" }
      responses:
        "200":
          description: 操作成功后的可恢复版本视图
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AgentMemoryRevision" }
        "400":
          description: 缺少或无效version、决定无效或请求包含未知字段
        "401":
          $ref: "#/components/responses/Error"
        "404":
          description: 对象不存在或不属于当前用户
        "409":
          description: version或记忆内容前置条件不匹配；整批未执行
  /agent/memories/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    patch:
      tags: [agent]
      summary: 更新一条属于当前用户的记忆
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [agent]
      summary: 删除一条属于当前用户的记忆
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /agent/memories/{id}/decide:
    post:
      tags: [agent]
      summary: 批准或拒绝一条属于当前用户的待审记忆
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /agent/history:
    get:
      tags: [agent]
      summary: 当前账号与画布的服务端 Agent 历史轮次
      description: 仅返回持久运行元数据，按 createdAt/id 降序游标分页，不读取模型会话、密钥或执行状态正文。浏览器缓存不再是找回运行的唯一入口。
      parameters:
        - { in: query, name: canvasId, required: true, schema: { type: string, maxLength: 80 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { in: query, name: cursor, schema: { type: string, maxLength: 1024 } }
      responses:
        "200": { description: "data.items/nextCursor/hasMore；items 含 id、canvasId、parentId、title、status、createdAt、updatedAt" }
        "400": { description: 非法分页参数或游标 }
        "401": { description: 未登录 }
        "404": { description: 画布不存在或不属于当前用户 }
  /agent/runs/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    get:
      tags: [agent]
      summary: 恢复当前用户已有 Agent 轮次的原请求与公共视图
      description: 返回 data.prompt 和 data.run，事件继续使用原有分页及 SSE 从0重放；不重新提交模型或制作任务，不还原其他账号或画布的数据。
      responses:
        "200": { description: 原用户请求与现有运行视图 }
        "401": { description: 未登录 }
        "404": { description: 轮次不存在或不属于当前用户 }
  /agent/conversations:
    get:
      tags: [agent]
      summary: 读取当前用户在画布中参与的 Agent 对话
      description: 只读目录，不创建运行或调用模型。按最新轮 createdAt、id 倒序；即使对话后来换绑画布，latestRunId、status、revision、cleanupPending 仍来自该对话全局最新一轮。仅返回当前登录用户的记录，画布必须属于当前用户。
      parameters:
        - in: query
          name: canvasId
          required: true
          schema: { type: string, maxLength: 80 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - in: query
          name: before
          description: 上一页返回的不透明 nextCursor
          schema: { type: string, maxLength: 512 }
      responses:
        "200":
          description: 信封 data 为 items（id、canvasId、title、latestRunId、status、revision、cleanupPending、createdAt、updatedAt）和可选 nextCursor；没有记录时 items 为空数组
        "400":
          description: 画布 ID、limit 或分页游标无效
        "404":
          description: 画布不存在或不属于当前用户
  /agent/conversations/{id}:
    get:
      tags: [agent]
      summary: 读取单个 Agent 对话的最新轮次摘要
      description: 只读控制列，不载入事件。用于判断当前画布目录之外的已选对话是否变化；字段与目录项相同，latestRunId、status、revision、cleanupPending 来自该对话全局最新一轮。仅返回当前登录用户的记录。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, maxLength: 80 }
      responses:
        "200":
          description: 信封 data 为单个目录项（id、canvasId、title、latestRunId、status、revision、cleanupPending、createdAt、updatedAt）
        "400":
          description: 会话 ID 无效
        "404":
          description: 会话不存在或不属于当前用户
  /agent/conversations/{id}/runs:
    get:
      tags: [agent]
      summary: 按时间顺序恢复当前用户的完整 Agent 对话轮次
      description: 仅返回当前用户、同一 conversationId 的不可变轮次，包含跨页面换绑画布后的轮次。按 createdAt、id 升序分页；每轮默认带尾部事件窗口，完整事件使用运行详情 fromStart 和 sinceSeq 分页读取。读取不恢复执行或重复调用工具。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, maxLength: 80 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - in: query
          name: after
          description: 上一页返回的不透明 nextCursor
          schema: { type: string, maxLength: 512 }
      responses:
        "200":
          description: 信封 data 为 items（与 data.run 相同的运行视图，含 conversationId、userPrompt、idempotencyKey）和可选 nextCursor
        "400":
          description: 会话 ID、limit 或分页游标无效
        "404":
          description: 会话不存在或不属于当前用户
  /agent/runs:
    post:
      tags: [agent]
      summary: 创建一轮云端 Agent 任务
      description: 同一画布同时只允许一轮执行。排队、运行、等待审批及终态收尾均占用；服务端在创建任务和预留积分前以事务串行校验。浏览器断开不释放占用，同一轮幂等恢复不受影响。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloudAgentRequest"
      responses:
        "200":
          description: 信封 data.run，包含新一轮 id、conversationId、userPrompt、idempotencyKey、canvasId、status、permissionMode、model 及时间
        "400":
          description: 参数、能力、模型或预算不符合要求，未创建任务
        "409":
          description: 幂等键已用于不同请求，或画布已有另一轮 Agent 占用。占用拒绝的 reason 为 canvas_agent_busy，details 包含 canvasId 和 agent（runId、status、cleanupPending），用于立即更新占用状态；未创建任务或预留积分，不自动重试。
  /agent/runs/{id}:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    get:
      tags: [agent]
      summary: 读取当前用户的 Agent 轮次
      description: data.run 只返回一页事件（默认最新 40 条）并带上 eventSeqBase、eventCount、latestSeq、eventsTruncated：eventSeqBase 是本次首条事件之前已入库的条数（不变量 events[i].seq == eventSeqBase + i + 1），latestSeq 可直接作为下次 sinceSeq，eventsTruncated 表示还有更早的记录未随本次返回。读取走 (run_id, sequence) 的 keyset 分页，不使用 offset；升级前把事件放在 state_json 里的轮次在事件表中没有行，读取回退到内存窗口。
      parameters:
        - in: query
          name: fromStart
          description: true 时从 sinceSeq 之后的首条事件开始读取（sinceSeq=0 时从 seq=1 开始）；省略时 sinceSeq=0 仍返回默认尾部窗口。用于多端首次恢复完整历史，分页追平用 latestSeq 与 eventCount 判断。
          schema: { type: boolean, default: false }
        - in: query
          name: sinceSeq
          required: false
          description: 只返回该事件序号之后的事件（非负整数，单次最多 500 条）；追平或越界时返回空 events
          schema: { type: integer, minimum: 0 }
        - in: query
          name: eventLimit
          required: false
          description: 单次返回的事件条数上限，1–500，默认为尾部窗口大小
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: 信封 data.run（含 events 与 eventSeqBase / eventCount / latestSeq / eventsTruncated）
        "400":
          description: fromStart 不是布尔值，或 sinceSeq、eventLimit 不是整数或超出范围
        "404":
          description: 轮次不存在或不属于当前用户
  /agent/runs/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    post:
      tags: [agent]
      summary: 从服务端父轮历史创建新轮次
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloudAgentRequest"
      responses:
        "200":
          description: 信封 data.run（新的 ID）
        "409":
          description: 父轮仍在执行、幂等键冲突，或画布已有另一轮 Agent 占用。旧父轮已有后续轮次时 reason 为 agent_conversation_stale_parent，客户端应同步最新历史，不能自动重发。原请求幂等回放优先于旧父轮检查。占用拒绝的 reason 为 canvas_agent_busy，details 包含 canvasId 和 agent（runId、status、cleanupPending），用于立即更新占用状态；不自动重试。
  /agent/runs/{id}/interjections:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    post:
      tags: [agent]
      summary: 向正在运行的 Agent 轮次插入一句话
      description: 不新建轮次、不产生新的扣费身份。插话排进当前运行，在下一次模型调用前送达；运行已结束返回 409。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text, messageId]
              properties:
                text:
                  type: string
                  maxLength: 4000
                messageId:
                  type: string
                  maxLength: 160
      responses:
        "200":
          description: 信封 data.accepted 与 data.pending
        "409":
          description: 本轮已结束，应改为新一轮发送
  /agent/runs/{id}/interjections/{messageId}:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          maxLength: 160
    delete:
      tags: [agent]
      summary: 撤回尚未送达模型的插话
      description: 只从待送队列移除并发出 user_interjection_withdrawn 事件；不停止本轮，也不取消已提交的生成任务。
      responses:
        "200":
          description: 信封 data.withdrawn
        "404":
          description: 插话不存在
        "409":
          description: 插话已送达模型或本轮已结束，无法撤回
  /agent/runs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    post:
      tags: [agent]
      summary: 取消当前用户的 Agent 轮次
      description: 停止 Agent 后续步骤并取消尚未提交上游的任务；已提交上游（可能已计费）的媒体任务继续完成并回写画布，收尾在其结束后完成。
      responses:
        "200":
          description: 信封 data.accepted
  /agent/runs/{id}/undo:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    post:
      tags: [agent]
      summary: 撤销当前 Agent 运行产生的最新画布变更
      description: |
        仅撤销该运行最新一笔且当前完整画布哈希仍匹配的变更，不取消任务或退款。
        优先使用 canvas_updated.undo 中的原 runId/canvasId/stepId/expectedSnapshotHash；历史卡片不能改用最新运行ID。
        成功响应丢失可重放原请求，画布仍为撤销后快照时幂等确认；有后续新修改仍返回409。
        未保留完整快照、超过1MiB快照容量或已提交收费任务的变更不可撤销。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedSnapshotHash]
              properties:
                stepId:
                  type: string
                  maxLength: 160
                expectedSnapshotHash:
                  type: string
                  minLength: 64
                  maxLength: 64
                  pattern: '^[0-9a-fA-F]{64}$'
                reason:
                  type: string
                  maxLength: 2000
      responses:
        "200":
          description: 信封 data.accepted 为 true 与当前 snapshotHash；相同原请求重试不会重复撤销
        "400":
          description: 请求无效、快照不可撤销或已提交任务不能撤销
        "409":
          description: 画布已发生后续变化，或 stepId 已不是该运行最新变更
  /agent/runs/{id}/approvals/{approvalId}/decision:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
      - name: approvalId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [agent]
      summary: 提交 Agent 工具审批决定
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                reason:
                  type: string
                  maxLength: 2000
                mediaSettings:
                  type: object
                  additionalProperties: false
                  description: 仅 approve 图片生成审批可传；替换本次模型、画幅和质量，重新强校验，不修改提示词、引用或目标。logicalModelId 与 channelId + channelModelKey 二选一。
                  required: [size, quality]
                  properties:
                    logicalModelId:
                      type: string
                    channelId:
                      type: string
                    channelModelKey:
                      type: string
                    size:
                      type: string
                    quality:
                      type: string
      responses:
        "200":
          description: 信封 data.accepted
        "409":
          description: 审批不存在、已过期或决定冲突
  /agent/runs/{id}/events:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    get:
      tags: [agent]
      summary: Agent 运行事件回放与持续订阅
      parameters:
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
        - name: Last-Event-ID
          in: header
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: |
            首次及 revision 变化时发送紧凑 run_snapshot；无变化时 heartbeat；agent_event.seq 为递增游标，cleanupPending 期间持续发送。
            canvas_updated 的 payload 可含 AgentCanvasUpdatedPayload 中的 undo 凭据。仅无已提交收费任务且有完整快照的普通写入提供非空凭据；缺省或 null 不显示可执行撤销。
          content:
            text/event-stream:
              schema:
                type: string
