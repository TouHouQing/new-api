components:
  parameters:
    AgentRunID:
      name: id
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    reviewShareCookie:
      type: apiKey
      in: cookie
      name: yingce_review_access
      description: "限定 /api/review-shares/{shareId} 路径；每次复核到期和撤销。"
    sessionCookie:
      type: apiKey
      in: cookie
      name: open_ai_canvas_session
  schemas:
    ProjectCreativeBrief:
      type: object
      required: [version, goal]
      properties:
        version: {type: integer, enum: [1]}
        goal: {type: string, enum: [story, product, explain, presenter, music, custom]}
        audience: {type: string, maxLength: 2000}
        keyMessage: {type: string, maxLength: 5000}
        targetDurationMs: {type: integer, minimum: 0, maximum: 3600000}
        language: {type: string, maxLength: 40}
        tone: {type: string, maxLength: 2000}
        constraints: {type: array, maxItems: 20, items: {type: string, minLength: 1, maxLength: 1000}}
        templateOrigin:
          type: object
          required: [id, version, inputHash]
          properties:
            id: {type: string, maxLength: 128}
            version: {type: integer, minimum: 1}
            inputHash: {type: string, pattern: '^[a-f0-9]{64}$'}
    ShotNarrative:
      type: object
      properties:
        purpose: {type: string, enum: ['', opening, establish, action, emotion, benefit, ending]}
        information: {type: string, maxLength: 2000}
        emotion: {type: string, maxLength: 500}
        visualBeat: {type: string, maxLength: 2000}
        continuityNeeds: {type: string, maxLength: 2000}
    ShotReferenceState:
      type: object
      required: [assetVersionId]
      properties:
        assetVersionId: {type: string, maxLength: 80}
        stage: {type: string, enum: ['', image, video], description: 留空同时用于图片与视频；分别固定时仅向对应生成阶段提交参考}
        wardrobe: {type: string, maxLength: 2000}
        emotion: {type: string, maxLength: 2000}
        propState: {type: string, maxLength: 2000}
        note: {type: string, maxLength: 2000}
        referenceResourceIds: {type: array, maxItems: 12, items: {type: string, maxLength: 80}}
    ImageLayerRegion:
      type: object
      additionalProperties: false
      required: [width, height, bbox, shape]
      properties:
        width: {type: integer, minimum: 1, maximum: 16777216}
        height: {type: integer, minimum: 1, maximum: 16777216}
        bbox: {type: array, minItems: 4, maxItems: 4, items: {type: number, minimum: 0, maximum: 1000}, description: 左上右下坐标，绑定原图实际宽高，宽高各至少2个归一化单位}
        shape: {type: string, enum: [rect, ellipse, rounded-rect]}
        radiusRatio: {type: number, minimum: 0, maximum: 0.5, description: 仅圆角矩形必填，按选区短边计算}
    ImageLayerWorkflowModel:
      type: object
      additionalProperties: false
      required: [prompt]
      properties:
        logicalModelId: {type: string, maxLength: 80}
        model: {type: string, maxLength: 160}
        prompt: {type: string, minLength: 1, maxLength: 32768}
        size: {type: string, maxLength: 40}
        quality: {type: string, maxLength: 40}
    ImageComposition:
      type: object
      additionalProperties: false
      required: [width, height, layers]
      description: 画面最多16777216像素，全部源图总像素最多67108864；按从底到顶进行sRGB合成，输出16位PNG。原文件不改动。坐标含小数时双线性采样，画面外透明。
      properties:
        width: {type: integer, minimum: 1, maximum: 16777216}
        height: {type: integer, minimum: 1, maximum: 16777216}
        layers:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [id, resourceId, x, y]
            properties:
              id: {type: string, minLength: 1, maxLength: 128, description: 绑定组时必须是准确的子图片节点ID且不能重复}
              resourceId: {type: string, minLength: 1, maxLength: 80}
              x: {type: number, description: 原图像素坐标，绝对值不超过画面宽加4096}
              y: {type: number, description: 原图像素坐标，绝对值不超过画面高加4096}
              opacity: {type: number, minimum: 0, maximum: 1, default: 1}
              visible: {type: boolean, default: true}
